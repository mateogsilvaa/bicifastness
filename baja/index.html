<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn-uicons.flaticon.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdn-uicons.flaticon.com; img-src 'self' data: blob: https://api.dicebear.com https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src https://www.google.com https://bicifastness.firebaseapp.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">

<title>Baja de avisos | BiciFastness</title>
<link rel="icon" href="/images/logo.png" type="image/png">
<link rel="stylesheet" href="/assets/css/app.css">
<style>
  main { max-width: 520px; }
  .caja { text-align: center; padding: 32px 24px; }
  .caja h1 { font-size: 1.5rem; margin: 0 0 12px; }
  .caja p { color: var(--text-muted); line-height: 1.6; margin: 0 0 18px; }

<body>
<a href="#principal" class="saltar-contenido">Saltar al contenido</a>

<main class="container" id="principal">

    <h1 id="titulo">Baja de avisos</h1>
    <p class="mensaje" id="mensaje" aria-live="polite">Comprobando el enlace...</p>

    <button id="confirmar" class="oculto">Darme de baja</button>
    <a href="/" id="volver">Volver a BiciFastness</a>
  </div>
</main>

<script type="module" src="/assets/js/paginas/baja.js"></script>

<link rel="icon" href="/images/icono/icono.svg?v=2" type="image/svg+xml">

<body>
<a href="#principal" class="saltar-contenido">Saltar al contenido</a>
<nav id="nav-principal"></nav>

<!--
  11 · Bicis: el buscador (11c/11g) y la ficha de cada bici (11d/11e/11i).
  /bici/?n=2471 abre la ficha. Se entra desde el mapa ("Buscar bici") y desde
  la encuesta de Subido. Las valoraciones son anonimas: nunca se ve quien.
-->
<main class="container ancho bici-pagina" id="principal">
  <div class="bici-columna">
    <div class="bici-cabeza">
      <a class="bici-atras" href="/territorio/" aria-label="Volver al mapa"></a>
      <h1>Buscar bici</h1>
    </div>
    <form class="campo-buscar bici-buscar" id="form-bici" role="search" novalidate>
      <label class="solo-lectores" for="numero-bici">Número de la bici</label>
      <input id="numero-bici" name="n" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5"
             autocomplete="off" placeholder="0000" aria-describedby="pista-bici">
    </form>
    <p class="encuesta-pista" id="pista-bici" aria-live="polite"></p>
    <div id="bici-recientes" class="bici-recientes"></div>
  </div>
  <section class="bici-ficha" id="bici-ficha" aria-live="polite"></section>
</main>

<div id="nav-inferior"></div>

<script type="module" src="/assets/js/paginas/bici.js"></script>

<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self'; img-src 'self' data: blob: https://api.dicebear.com https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src https://www.google.com https://bicifastness.firebaseapp.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Rankings por ruta de BiciFastness: los mejores tiempos verificados de BiciMAD en Madrid.">
<title>Rankings | BiciFastness</title>
<link rel="icon" href="/images/logo.png" type="image/png">
<link rel="stylesheet" href="/assets/css/app.css">
<style>
  .buscador { margin-bottom: 18px; }
  .rutas { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: thin; }
  .ruta-btn { flex-shrink: 0; width: auto; margin: 0; padding: 10px 16px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); font-size: .85rem; font-weight: 600; white-space: nowrap; }
  .ruta-btn:hover { background: var(--bg-input); }
  .ruta-btn.activa { border-color: var(--primary); color: var(--primary); }
  .ruta-btn.destacada { border-color: var(--oro); color: var(--oro); }
  .titulo-ranking { display: flex; align-items: center; gap: 12px; margin: 26px 0 16px; flex-wrap: wrap; }
  .titulo-ranking h2 { margin: 0; }
  #btn-fijar { width: auto; margin: 0; padding: 8px 12px; background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
  #btn-fijar.fijada { color: var(--primary); border-color: var(--primary); }
  .fila { display: flex; align-items: center; gap: 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radio); padding: 12px 16px; margin-bottom: 10px; }
  .fila.p1 { border-color: var(--oro); }
  .fila.p2 { border-color: var(--plata); }
  .fila.p3 { border-color: var(--bronce); }
  .puesto { font-weight: 900; font-size: 1.1rem; min-width: 38px; color: var(--text-muted); }
  .fila.p1 .puesto { color: var(--oro); }
  .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--bg-input); cursor: pointer; }
  .piloto { flex: 1; min-width: 0; cursor: pointer; }
  .piloto strong { display: block; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .piloto span { font-size: .75rem; color: var(--text-muted); }
  .marca { text-align: right; }
  .marca strong { display: block; font-size: 1rem; }
  .marca span { font-size: .75rem; color: var(--text-muted); }
  .btn-reportar { width: auto; margin: 0 0 0 8px; padding: 8px 10px; background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
  .btn-reportar:hover { border-color: var(--error); color: var(--error); background: transparent; }
  #modal-piloto { position: fixed; inset: 0; background: rgba(4,6,10,.86); z-index: 9500; display: none; align-items: center; justify-content: center; padding: 20px; }
  .ficha { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radio-xl); padding: 28px; max-width: 380px; width: 100%; text-align: center; }
  .ficha img { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; }
  .cifras { display: flex; justify-content: space-around; margin: 20px 0; }
  .cifras div strong { display: block; font-size: 1.4rem; color: var(--primary); }
  .cifras div span { font-size: .75rem; color: var(--text-muted); }

  /* Tabla de tiempos: se comporta como un panel de crono. */
  .fila { transition: transform var(--transicion), border-color var(--transicion); }
  .fila:hover { transform: translateX(2px); border-color: var(--border-fuerte); }
  .puesto { font-family: var(--fuente-mono); font-variant-numeric: tabular-nums; font-size: 1rem; }
  .marca strong { font-family: var(--fuente-mono); font-variant-numeric: tabular-nums; font-size: 1.05rem; letter-spacing: -.03em; }
  .marca span { font-family: var(--fuente-mono); font-size: .68rem; }
  .fila.p1 { background: linear-gradient(100deg, rgba(255,207,61,.07), transparent 55%), var(--bg-card); }
  .fila.p1 .puesto { text-shadow: 0 0 14px rgba(255,207,61,.5); }
  .avatar { border: 1px solid var(--border); }
  .ruta-btn { border-radius: 100px; transition: all var(--transicion); }
  .ruta-btn.activa { background: var(--primary-tenue); }
  .ruta-btn.destacada { background: rgba(255,207,61,.08); }
  .cifras div strong { font-family: var(--fuente-mono); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<a href="#principal" class="saltar-contenido">Saltar al contenido</a>
<nav id="nav-principal"></nav>
<div class="bottom-nav" id="nav-inferior"></div>

<main class="container" id="principal">
  <h2>Rankings por ruta</h2>

  <div class="buscador">
    <label class="solo-lectores" for="busca-ruta">Buscar una ruta</label>
    <input type="search" id="busca-ruta" placeholder="Busca por nombre de estacion o numero" autocomplete="off">
  </div>

  <div class="rutas" id="rutas"></div>

  <section id="seccion-ranking" class="oculto">
    <div class="titulo-ranking">
      <h2 id="titulo-ruta"></h2>
      <button id="btn-fijar" title="Anclar esta ruta a tus favoritas" aria-label="Anclar ruta">
        <i class="fi fi-rr-bookmark"></i>
      </button>
    </div>
    <div id="lista"></div>
  </section>

  <p class="mensaje" id="mensaje"></p>
</main>

<div id="modal-piloto" role="dialog" aria-modal="true" aria-label="Perfil del piloto"></div>
<footer id="pie-legal"></footer>

<script type="module" src="/assets/js/paginas/ranking.js"></script>
</body>
</html>

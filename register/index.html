<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://unpkg.com 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src https://www.google.com https://bicifastness.firebaseapp.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Crea tu cuenta de BiciFastness y empieza a competir con tus trayectos en BiciMAD.">
<meta name="robots" content="noindex">
<title>Crear cuenta | BiciFastness</title>
<link rel="icon" href="/images/logo.png" type="image/png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/images/icono/icono-180.png">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<a href="#principal" class="saltar-contenido">Saltar al contenido</a>

<main class="container estrecho" id="principal">
  <a class="fila" href="/" style="text-decoration: none; margin-bottom: var(--e6);">
    <img src="/images/logo.png" alt="" width="32" height="32">
    <span class="h2" style="margin: 0;">BiciFastness</span>
  </a>

  <h1 class="h1">Crear cuenta</h1>

  <form id="form-registro" novalidate>
    <div class="campo">
      <label for="username">Nombre de piloto</label>
      <input id="username" name="username" type="text" autocomplete="nickname"
             maxlength="20" required aria-describedby="pista-username">
      <p class="menor apagado" id="pista-username" aria-live="polite">
        Es el nombre que veran los demas en la clasificacion.
      </p>
    </div>

    <div class="campo">
      <label for="email">Correo electronico</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
    </div>

    <div class="campo">
      <label for="password">Contrasena</label>
      <input id="password" name="password" type="password" autocomplete="new-password"
             required aria-describedby="pista-password">
      <p class="menor apagado" id="pista-password" aria-live="polite"></p>
    </div>

    <div class="campo">
      <label for="password2">Repite la contrasena</label>
      <input id="password2" name="password2" type="password" autocomplete="new-password" required>
    </div>

    <!--
      Casillas SIN premarcar y separadas: el consentimiento tiene que ser un acto
      expreso para cada cosa. Hay un test que comprueba que ninguna nace marcada.
    -->
    <div class="pila" style="margin-bottom: var(--e5);">
      <label class="fila menor">
        <input type="checkbox" id="acepta-edad">
        <span>Tengo 14 anos o mas.</span>
      </label>
      <label class="fila menor">
        <input type="checkbox" id="acepta-terminos">
        <span>He leido y acepto los <a href="/legal/terminos/">terminos de uso</a>.</span>
      </label>
      <label class="fila menor">
        <input type="checkbox" id="acepta-privacidad">
        <span>He leido la <a href="/legal/privacidad/">politica de privacidad</a>.</span>
      </label>
    </div>

    <button type="submit" class="btn" id="btn-registro">Crear mi cuenta</button>
    <p class="mensaje" id="mensaje" aria-live="polite"></p>
  </form>

  <p class="menor" style="margin-top: var(--e5);">
    <a href="/entrar/">Ya tengo cuenta</a>
  </p>
</main>

<footer id="pie-legal"></footer>

<script type="module" src="/assets/js/paginas/register.js"></script>
</body>
</html>

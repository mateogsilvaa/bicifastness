<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta | BiciFastness</title>
<link rel="icon" href="/images/logo.png" type="image/png">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<style>
  body { justify-content: center; align-items: center; padding: 20px 0; }
  .card { width: 100%; max-width: 380px; text-align: center; }
  h1 { font-size: 1.5rem; color: var(--text-main); margin: 0 0 4px; letter-spacing: .01em; font-stretch: 88%; }
  h2.sub { border: none; color: var(--text-tenue); font-family: var(--fuente-mono); font-weight: 500; font-size: .66rem; text-transform: uppercase; letter-spacing: .2em; margin: 0 0 22px; display: block; padding: 0; }
  h2.sub::before { display: none; }
  input { margin: 8px 0; text-align: left; }
  .pista { font-size: .75rem; color: var(--text-muted); text-align: left; margin: -4px 0 8px; min-height: 16px; }
  .pista.mal { color: var(--error); }
  .legal { text-align: left; font-size: .8rem; color: var(--text-muted); margin: 18px 0 4px; line-height: 1.5; }
  .legal label { display: flex; gap: 10px; align-items: flex-start; text-transform: none; font-size: .8rem; font-weight: 400; color: var(--text-muted); margin-bottom: 10px; cursor: pointer; }
  .legal input[type=checkbox] { width: 18px; height: 18px; margin: 2px 0 0; flex-shrink: 0; accent-color: var(--primary); }
  .legal a { color: var(--primary-claro); font-weight: 600; }
  .legal input[type=checkbox] { accent-color: var(--primary); }
  .enlace { display: block; margin-top: 15px; font-size: .85rem; color: var(--text-muted); text-decoration: none; font-weight: 600; }
  .enlace:hover { color: var(--primary); }
  #pie-legal { border: none; margin-top: 24px; padding: 0; }
</style>
</head>
<body>
<main class="card">
  <h1>BiciFastness</h1>
  <h2 class="sub">Crear cuenta</h2>

  <form id="form-registro" novalidate>
    <label class="solo-lectores" for="username">Nombre de piloto</label>
    <input type="text" id="username" placeholder="Nombre de piloto" autocomplete="nickname"
           minlength="3" maxlength="24" required>
    <p class="pista" id="pista-username"></p>

    <label class="solo-lectores" for="email">Correo electronico</label>
    <input type="email" id="email" placeholder="Correo electronico" autocomplete="email" required>

    <label class="solo-lectores" for="password">Contrasena</label>
    <input type="password" id="password" placeholder="Contrasena (minimo 8 caracteres)"
           autocomplete="new-password" minlength="8" required>
    <p class="pista" id="pista-password"></p>

    <label class="solo-lectores" for="password2">Repite la contrasena</label>
    <input type="password" id="password2" placeholder="Repite la contrasena"
           autocomplete="new-password" required>

    <!-- Consentimiento explicito, separado y sin marcar por defecto: es lo que
         exige el RGPD (art. 7) para poder acreditarlo despues. -->
    <div class="legal">
      <label>
        <input type="checkbox" id="acepta-terminos">
        <span>He leido y acepto los <a href="/legal/terminos/" target="_blank" rel="noopener">Terminos de Uso</a>.</span>
      </label>
      <label>
        <input type="checkbox" id="acepta-privacidad">
        <span>He leido la <a href="/legal/privacidad/" target="_blank" rel="noopener">Politica de Privacidad</a> y acepto el tratamiento de mis datos descrito en ella.</span>
      </label>
      <label>
        <input type="checkbox" id="acepta-edad">
        <span>Confirmo que tengo 14 anos o mas.</span>
      </label>
    </div>

    <button type="submit" id="btn-registro">Empezar a competir</button>
  </form>

  <p class="mensaje" id="mensaje"></p>

  <a href="/entrar/" class="enlace">Ya tengo cuenta. Iniciar sesion</a>
  <a href="/home/" class="enlace">Explorar sin cuenta</a>

  <footer id="pie-legal"></footer>
</main>

<script type="module">
  import {
    auth, onAuthStateChanged, createUserWithEmailAndPassword,
    sendEmailVerification, traducirErrorAuth,
  } from '/assets/js/firebase.js';
  import { aplicarTema, montarPieLegal, montarAvisoCookies } from '/assets/js/ui.js';
  import { id, estado } from '/assets/js/dom.js';
  import { PALABRAS_PROHIBIDAS } from '/assets/data/palabras-prohibidas.js';
  import { crearPerfil } from '/assets/js/acciones.js';

  aplicarTema();
  montarPieLegal();
  montarAvisoCookies();

  const mensaje = id('mensaje');
  const boton = id('btn-registro');
  let registrando = false;

  onAuthStateChanged(auth, (usuario) => {
    if (usuario && !registrando) window.location.replace('/home/');
  });

  // Misma normalizacion que en el servidor: lista y entrada, los dos lados.
  const normalizar = (t) => String(t ?? '').toLowerCase().normalize('NFD')
    .replace(/\p{Diacritic}/gu, '').replace(/[\s\-_.]+/g, '');
  const PROHIBIDAS = [...new Set(PALABRAS_PROHIBIDAS.map(normalizar))].filter(Boolean);

  /**
   * Validacion en el cliente: sirve para dar respuesta inmediata, NO para
   * proteger nada. El servidor vuelve a comprobarlo todo en completarRegistro.
   */
  function validarNombre(valor) {
    const nombre = valor.trim();
    if (nombre.length < 3) return 'Minimo 3 caracteres.';
    if (nombre.length > 24) return 'Maximo 24 caracteres.';
    if (!/^[\p{L}\p{N}_\- ]+$/u.test(nombre)) return 'Solo letras, numeros, guion y espacio.';
    const limpio = normalizar(nombre);
    if (PROHIBIDAS.some((p) => limpio.includes(p))) return 'Ese nombre no esta permitido.';
    return null;
  }

  function validarClave(clave) {
    if (clave.length < 8) return 'Minimo 8 caracteres.';
    if (clave.length > 128) return 'Demasiado larga.';
    // Las listas de contrasenas filtradas empiezan siempre por estas.
    const obvias = ['12345678', 'password', 'contrasena', 'qwertyui', 'bicimad1', '11111111'];
    if (obvias.some((o) => clave.toLowerCase().includes(o))) return 'Esa contrasena es demasiado facil de adivinar.';
    return null;
  }

  const pistaUsuario = id('pista-username');
  id('username').addEventListener('input', (e) => {
    const error = e.target.value ? validarNombre(e.target.value) : null;
    pistaUsuario.textContent = error || '';
    pistaUsuario.className = `pista${error ? ' mal' : ''}`;
    e.target.setAttribute('aria-invalid', error ? 'true' : 'false');
  });

  const pistaClave = id('pista-password');
  id('password').addEventListener('input', (e) => {
    const error = e.target.value ? validarClave(e.target.value) : null;
    pistaClave.textContent = error || '';
    pistaClave.className = `pista${error ? ' mal' : ''}`;
    e.target.setAttribute('aria-invalid', error ? 'true' : 'false');
  });

  id('form-registro').addEventListener('submit', async (evento) => {
    evento.preventDefault();

    const username = id('username').value.trim();
    const email = id('email').value.trim().toLowerCase();
    const clave = id('password').value;
    const clave2 = id('password2').value;

    const fallo = validarNombre(username)
      || (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) ? 'El correo no es valido.' : null)
      || validarClave(clave)
      || (clave !== clave2 ? 'Las contrasenas no coinciden.' : null)
      || (!id('acepta-terminos').checked ? 'Debes aceptar los Terminos de Uso.' : null)
      || (!id('acepta-privacidad').checked ? 'Debes aceptar la Politica de Privacidad.' : null)
      || (!id('acepta-edad').checked ? 'Debes confirmar que tienes 14 anos o mas.' : null);

    if (fallo) { estado(mensaje, fallo, 'error'); return; }

    boton.disabled = true;
    boton.textContent = 'Creando cuenta...';
    estado(mensaje, '');
    registrando = true;

    try {
      await createUserWithEmailAndPassword(auth, email, clave);

      // El perfil lo crea el servidor. Antes lo escribia el navegador con
      // `isAdmin: false` en el objeto, lo que dejaba claro que ese campo era
      // manipulable desde el cliente: bastaba con enviarlo a true.
      await crearPerfil({ username });

      await sendEmailVerification(auth.currentUser).catch(() => {});
      window.location.replace('/home/');
    } catch (error) {
      registrando = false;
      boton.disabled = false;
      boton.textContent = 'Empezar a competir';

      // Si Auth creo la cuenta pero el perfil fallo, la dejamos utilizable:
      // al volver a entrar se reintenta el alta del perfil.
      const texto = error.code ? traducirErrorAuth(error) : error.message;
      estado(mensaje, texto, 'error');
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://apis.google.com 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://server.arcgisonline.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://api.citybik.es; frame-src https://www.google.com https://bicifastness.firebaseapp.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BiciFastness">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Crea tu cuenta de BiciFastness y empieza a competir con tus trayectos en BiciMAD.">
<meta name="robots" content="noindex">
<title>Crea tu cuenta | BiciFastness</title>
<link rel="icon" href="/images/icono/icono.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/images/icono/icono-48.png?v=2" sizes="48x48" type="image/png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F10" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/images/icono/icono-180.png?v=2">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="con-marca">
<a href="#principal" class="saltar-contenido">Saltar al contenido</a>

<!--
  01 Acceso · 1e. Paso 1 de 2: solo correo y contraseña. El paso 2 es el mismo
  que tras entrar con Google (nombre de piloto y las tres casillas, en la
  portada), asi que el consentimiento se pide igual venga uno por donde venga,
  y ANTES de que exista ningun perfil. El correo de verificacion sale despues y
  no impide jugar.
-->
<!-- 08 · 8e: en escritorio, panel azul fijo a la izquierda y el formulario
     de 400 px a la derecha. En movil no se ve. -->
<aside class="acceso-marca" aria-hidden="true">
  <span class="logo">
    <svg class="logo-anillo blanco" viewBox="0 0 24 24" width="30" height="30" focusable="false">
      <rect width="24" height="24" rx="6.5"></rect>
      <path d="M12 5 A7 7 0 1 1 5.94 8.5"></path>
      <circle cx="5.94" cy="8.5" r="2.1"></circle>
    </svg>
    <span class="logo-palabra">bicifastness</span>
  </span>
  <svg class="acceso-marca-anillo" viewBox="0 0 24 24" width="220" height="220" focusable="false"><path d="M12 5 A7 7 0 1 1 5.94 8.5"></path><circle cx="5.94" cy="8.5" r="2.1"></circle></svg>
  <span class="acceso-marca-titulo">Una vuelta<br>cada día.</span>
  <span class="acceso-marca-texto">Cada día que subes un trayecto, tu racha crece y tus puntos se multiplican hasta ×1,5.</span>
  <span class="acceso-marca-aviso">Proyecto independiente. Sin relación con BiciMAD ni la EMT.</span>
</aside>
<main class="acceso" id="principal">
  <div class="acceso-barra">
    <a class="boton-icono" href="/" aria-label="Volver a la portada" id="volver"></a>
  </div>

  <form class="acceso-cuerpo" id="form-registro" novalidate>
    <p class="acceso-paso">Paso 1 de 2</p>
    <h1 class="acceso-titulo">Crea tu cuenta</h1>

    <div class="campo-acceso">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email"
             required aria-describedby="error-email">
      <p class="acceso-error izquierda" id="error-email" aria-live="polite"></p>
    </div>

    <div class="campo-acceso">
      <label for="password">Contraseña</label>
      <div class="con-ojo">
        <input id="password" name="password" type="password" autocomplete="new-password"
               required minlength="8" aria-describedby="fuerza-clave error-clave">
        <button type="button" class="ojo" id="ver-clave" aria-label="Mostrar la contraseña" aria-pressed="false"></button>
      </div>
      <div class="fuerza-clave" id="fuerza-clave" aria-live="polite"></div>
      <p class="acceso-error izquierda" id="error-clave" aria-live="polite"></p>
    </div>

    <div class="acceso-hueco"></div>
    <button type="submit" class="btn grande" id="btn-registro">Continuar</button>
    <p class="acceso-error" id="mensaje" aria-live="polite"></p>
    <p class="acceso-pie">¿Ya tienes cuenta? <a href="/entrar/">Entrar</a></p>
  </form>
</main>

<script type="module" src="/assets/js/paginas/register.js"></script>
</body>
</html>

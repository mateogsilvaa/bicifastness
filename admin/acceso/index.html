<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://apis.google.com 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://server.arcgisonline.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://api.citybik.es; frame-src https://www.google.com https://bicifastness.firebaseapp.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BiciFastness">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Abrir o cerrar la web y la lista de acceso.">
<meta name="robots" content="noindex">
<title>Acceso | BiciFastness</title>
<link rel="icon" href="/images/icono/icono.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/images/icono/icono-48.png?v=2" sizes="48x48" type="image/png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F10" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/images/icono/icono-180.png?v=2">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<a href="#principal" class="saltar-contenido">Saltar al contenido</a>
<main class="adm-pagina" id="principal">
  <h1 class="d2" style="margin: 0;">Acceso a la web</h1>
  <p class="mensaje" id="mensaje" aria-live="polite"></p>

  <div class="adm-dos">
    <section class="adm-tarjeta" aria-labelledby="t-modo">
      <h2 id="t-modo">Estado</h2>
      <p class="menor apagado">En construcción solo entran la administración y los correos de la lista. Estar en la lista no da acceso al panel.</p>
      <div class="acceso-modos" role="radiogroup" aria-label="Estado de la web">
        <label class="acceso-modo"><input type="radio" name="modo" value="abierta" aria-label="Abierta"> <span><strong>Abierta</strong><small>Para todo el mundo.</small></span></label>
        <label class="acceso-modo"><input type="radio" name="modo" value="obras" aria-label="En construcción"> <span><strong>En construcción</strong><small>Solo la lista blanca.</small></span></label>
      </div>
      <label class="campo" for="acceso-mensaje">Mensaje para los demás (opcional)
        <textarea id="acceso-mensaje" rows="2" maxlength="300" placeholder="BiciFastness está en construcción. Volvemos muy pronto."></textarea>
      </label>
      <button class="btn" type="button" id="btn-guardar-modo" style="width: auto;">Guardar</button>
    </section>

    <section class="adm-tarjeta" aria-labelledby="t-lista">
      <h2 id="t-lista">Lista blanca</h2>
      <p class="menor apagado">El correo con el que entran (Google o contraseña, con el correo verificado).</p>
      <div class="acceso-alta">
        <label class="solo-lectores" for="acceso-correo">Correo</label>
        <input type="email" id="acceso-correo" placeholder="correo@ejemplo.com" autocomplete="off">
        <label class="solo-lectores" for="acceso-nota">Nota</label>
        <input type="text" id="acceso-nota" maxlength="80" placeholder="Nota (opcional)" autocomplete="off">
        <button class="btn" type="button" id="btn-anadir" style="width: auto;">Añadir</button>
      </div>
      <div class="adm-estado-lista" id="lista-acceso"></div>
    </section>
  </div>
</main>
<script type="module" src="/assets/js/paginas/admin-acceso.js"></script>
</body>
</html>

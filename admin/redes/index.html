<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://apis.google.com 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://server.arcgisonline.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://api.citybik.es; frame-src https://www.google.com https://bicifastness.firebaseapp.com https://recaptcha.google.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BiciFastness">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Piezas para Instagram de BiciFastness.">
<meta name="robots" content="noindex">
<title>Redes | BiciFastness</title>
<link rel="icon" href="/images/icono/icono.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/images/icono/icono-48.png?v=2" sizes="48x48" type="image/png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F10" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/images/icono/icono-180.png?v=2">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<a href="#principal" class="saltar-contenido">Saltar al contenido</a>
<!-- 13f · Admin · Redes: elige pieza y periodo, revisa y descarga. -->
<main class="adm-pagina" id="principal">
  <p class="mensaje" id="mensaje" aria-live="polite"></p>
  <div class="redes-13f">
    <div class="redes-panel">
      <strong class="redes-titulo">Generar pieza</strong>
      <div class="redes-piezas" id="piezas" role="group" aria-label="Pieza"></div>
      <div class="redes-campo">
        <span>Periodo</span>
        <div class="redes-periodo" id="periodo"></div>
      </div>
      <div class="redes-campo">
        <span>Pilotos que salen</span>
        <div class="redes-pilotos" id="pilotos"></div>
      </div>
      <div class="redes-hueco"></div>
      <button class="btn" type="button" id="btn-descargar">Descargar PNG</button>
    </div>
    <div class="redes-vista">
      <div class="redes-vista-cabeza"><strong id="vista-titulo">Vista previa</strong><span id="vista-medida"></span></div>
      <div class="redes-lienzo" id="lienzo"></div>
      <span class="redes-nota" id="vista-nota"></span>
    </div>
  </div>
  <!-- Viaje inventado: la hoja de compartir de la app con los datos que pongas.
       No se guarda nada (paginas/admin-redes.js, montarViajeInventado). -->
  <section class="adm-tarjeta viaje-inventado" aria-labelledby="t-inventado">
    <h2 id="t-inventado">Compartir un viaje inventado</h2>
    <p class="menor apagado">Para contenido: la misma imagen que comparte un piloto, con los datos que tú pongas. No se guarda nada ni sale en ningún ranking.</p>
    <form id="form-inventado" class="form-inventado" novalidate>
      <div class="campo"><label for="inv-tipo">Tipo</label>
        <select id="inv-tipo"><option value="ruta">Tiempo en ruta</option><option value="record">Récord de ruta</option></select></div>
      <div class="campo"><label for="inv-origen">Estación de salida</label><input id="inv-origen" list="inv-estaciones" placeholder="Número o nombre" autocomplete="off" required></div>
      <div class="campo"><label for="inv-destino">Estación de llegada</label><input id="inv-destino" list="inv-estaciones" placeholder="Número o nombre" autocomplete="off" required></div>
      <datalist id="inv-estaciones"></datalist>
      <div class="campo"><label for="inv-tiempo">Tiempo (mm:ss)</label><input id="inv-tiempo" inputmode="numeric" placeholder="12:29" required></div>
      <div class="campo"><label for="inv-piloto">Piloto</label><input id="inv-piloto" placeholder="bicifastness" maxlength="24"></div>
      <div class="campo"><label for="inv-puesto">Puesto (opcional)</label><input id="inv-puesto" type="number" min="1" placeholder="3"></div>
      <div class="campo"><label for="inv-total">De cuántos pilotos</label><input id="inv-total" type="number" min="1" placeholder="48"></div>
      <div class="campo"><label for="inv-puntos">Puntos (o mejora en s si es récord)</label><input id="inv-puntos" type="number" min="0" placeholder="69"></div>
      <p class="mensaje" id="msg-inventado" aria-live="polite"></p>
      <button class="btn" type="submit">Generar y compartir</button>
    </form>
  </section>
</main>

<script type="module" src="/assets/js/paginas/admin-redes.js"></script>
</body>
</html>

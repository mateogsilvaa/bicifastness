<body>
<a href="#principal" class="saltar-contenido">Saltar al contenido</a>
<main class="adm-pagina" id="principal">
  <div class="fila separada">
    <div>
      <h1 class="d2" style="margin: 0;">Panel de control</h1>
      <p class="menor apagado" id="actualizado"></p>
    </div>
    <button class="btn secundario" id="btn-recargar" type="button" style="width: auto;">Recargar</button>
  </div>
  <p class="mensaje" id="mensaje" aria-live="polite"></p>

  <!-- Lo que pide atencion hoy: gente, trayectos, revision y denuncias. -->
  <div class="adm-kpis" id="kpis"></div>

  <div class="adm-tres">
    <section class="adm-tarjeta" aria-labelledby="t-sistema">
      <h2 id="t-sistema">Sistema</h2>
      <div class="adm-estado-lista" id="sistema"></div>
    </section>
    <section class="adm-tarjeta" aria-labelledby="t-liga">
      <h2 id="t-liga">Liga en juego</h2>
      <div id="liga"></div>
    </section>
    <section class="adm-tarjeta" aria-labelledby="t-semana">
      <h2 id="t-semana">Ruta de la semana</h2>
      <div id="ruta-semana"></div>
    </section>
  </div>

  <div class="adm-dos">
    <section class="adm-tarjeta" aria-labelledby="t-atajos">
      <h2 id="t-atajos">Accesos</h2>
      <div class="adm-acciones" id="atajos"></div>
    </section>
    <section class="adm-tarjeta" aria-labelledby="t-registro">
      <h2 id="t-registro">Registro de administración</h2>
      <p class="menor apagado">Las últimas acciones y entradas. No se puede editar ni borrar.</p>
      <div class="adm-estado-lista" id="registro"></div>
    </section>
  </div>
</main>
<script type="module" src="/assets/js/paginas/admin-panel.js"></script>
</body>

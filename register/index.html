<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <title>Registro | BiciFastness</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        :root { --bg-main: #121212; --bg-card: #1a1a1a; --text-main: #f1efeb; --text-muted: #888; --border: #333; --primary: #0071c3; --primary-hover: #005a9e; }
        [data-theme="light"] { --bg-main: #f0f2f5; --bg-card: #ffffff; --text-main: #111; --text-muted: #555; --border: #ddd; --primary: #0071c3; --primary-hover: #005a9e; }
        body { margin: 0; padding: 0; background-color: var(--bg-main); color: var(--text-main); font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; transition: background 0.3s, color 0.3s; }
        .card { background: var(--bg-card); padding: 2.5rem 2rem; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 100%; max-width: 350px; text-align: center; box-sizing: border-box;}
        h1 { color: var(--primary); margin-top: 0; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }
        h3 { margin-top: 0; color: var(--text-muted); font-weight: 600; font-size: 0.9rem; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); border-radius: 8px; box-sizing: border-box; font-family: inherit; transition: border 0.3s; }
        input:focus { border-color: var(--primary); outline: none; }
        button { width: 100%; padding: 14px; margin-top: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: background 0.3s, transform 0.1s; }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .toggle { margin-top: 20px; font-size: 0.85em; }
        .toggle a { color: var(--text-muted); text-decoration: none; font-weight: 600; transition: color 0.3s; }
        .toggle a:hover { color: var(--primary); }
        .guest-link { margin-top: 15px; display: block; font-size: 0.9em; font-weight: 700; color: var(--primary); text-decoration: none; padding: 10px; border: 1px solid var(--border); border-radius: 8px; transition: 0.2s;}
        .guest-link:hover { background: rgba(0, 113, 195, 0.1); border-color: var(--primary);}
        #error-msg { color: #ff4444; font-size: 0.85em; margin-top: 10px; min-height: 20px; font-weight: 600; }
    </style>
<link rel="icon" href="../images/logo.png" type="image/png">
</head>
<body>
    <div class="card">
        <h1>BiciFastness</h1>
        <h3>Crear Cuenta</h3>
        <input type="text" id="username" placeholder="Nombre de usuario (Rider)">
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña (mín. 6 chars)">
        <input type="password" id="confirm-password" placeholder="Repite contraseña">
        <button id="register-btn">Empezar a competir</button>
        <div id="error-msg"></div>
        <div class="toggle"><a href="../">¿Ya tienes cuenta? Inicia sesión</a></div>
        <a href="../home/" class="guest-link">👀 Explorar sin cuenta</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import PocketBase from 'https://cdn.jsdelivr.net/npm/pocketbase@0.22.0/+esm';
        import { containsBadWords } from '../badwords.js';

        const pb = new PocketBase('https://vicinity-unfrozen-washout.ngrok-free.dev');
        
        // Pase VIP para saltar advertencia de Ngrok
        pb.beforeSend = function (url, options) {
            options.headers = Object.assign({}, options.headers, {
                'ngrok-skip-browser-warning': 'true'
            });
            return { url, options };
        };
        const firebaseConfig = { apiKey: "AIzaSyBG9QdjEG9Qmg27Dy05t0eVcVFMMPpSyVk", authDomain: "bicifastness.firebaseapp.com", projectId: "bicifastness", messagingSenderId: "656116731421", appId: "1:656116731421:web:a4154d028fe9721c5800f4" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
        let isRegistering = false;

        onAuthStateChanged(auth, (user) => { 
            if (user && !isRegistering) window.location.href = "../home/"; 
        });

        const btn = document.getElementById('register-btn');
        const errorMsg = document.getElementById('error-msg');

        btn.addEventListener('click', async () => {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirm-password').value;
            
            errorMsg.innerText = "";
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if(!username || !email || !pass || !confirmPass) { errorMsg.innerText = "Rellena todos los campos."; return; }
            if (!emailRegex.test(email)) { errorMsg.innerText = "Correo no válido."; return; }
            if (username.length < 3 || username.length > 24) { errorMsg.innerText = "El nombre debe tener entre 3 y 24 caracteres."; return; }
            if (!/^[\p{L}\p{N}_\-\s]+$/u.test(username)) { errorMsg.innerText = "El nombre contiene caracteres no válidos."; return; }
            if (pass.length < 6 || pass.length > 128) { errorMsg.innerText = "La contraseña no cumple requisitos."; return; }
            if(pass !== confirmPass) { errorMsg.innerText = "Las contraseñas no coinciden."; return; }
            if (containsBadWords(username)) { errorMsg.innerText = "El nombre de usuario contiene palabras no permitidas."; return; }

            try {
                btn.innerText = "Creando..."; btn.disabled = true;
                isRegistering = true; 
                
                const avatarUrl = `https://api.dicebear.com/7.x/initials/svg?seed=${username}&backgroundColor=0071c3`;
                
                // 1. Auth con Firebase
                await createUserWithEmailAndPassword(auth, email, pass);
                
                // 2. Auth con PocketBase y Write Dual
                await pb.collection('usuarios').create({
                    email: email,
                    password: pass,
                    passwordConfirm: pass,
                    username: username,
                    avatar: avatarUrl,
                    isAdmin: false
                });
                await pb.collection('usuarios').authWithPassword(email, pass);

                // 3. Backup en Firestore
                await setDoc(doc(db, "usuarios", email), {
                    username: username,
                    email: email,
                    isAdmin: false,
                    avatar: avatarUrl
                });
                
                window.location.href = "../home/";
            } catch (error) {
                isRegistering = false; 
                btn.disabled = false; btn.innerText = "Empezar a competir";
                if(error.code === 'auth/email-already-in-use') errorMsg.innerText = "Correo ya registrado.";
                else errorMsg.innerText = "Error: " + (error.message || "Error conectando a PB");
            }
        });
    </script>
</body>
</html>

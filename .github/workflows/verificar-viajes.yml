name: Verificar viajes

# El worker es el servidor de confianza de la app. Se despierta cada 5 minutos,
# coge los viajes que esperan analisis y los aprueba, los rechaza o los manda a
# revision humana.
#
# Va aqui y no en Cloud Functions porque desplegar funciones en Firebase exige
# el plan Blaze (tarjeta), mientras que Actions es gratis e ilimitado en
# repositorios publicos.

on:
  # ---------------------------------------------------------------------------
  # EL CRON ESTA APAGADO A PROPOSITO HASTA EL LANZAMIENTO. Volver a activarlo es
  # quitar el comentario de las dos lineas de abajo, y esta anotado en el
  # checklist del README y en el issue #7.
  #
  # Por que: sin `FIREBASE_SERVICE_ACCOUNT` el worker no puede hacer nada, pero
  # el cron se despierta igual. Ademas de mandar un correo de fallo por
  # ejecucion, en un repositorio PRIVADO cada una gasta cuota: Actions factura
  # por minuto empezado, asi que 288 despertares al dia son 288 minutos contra
  # el limite de 2.000 al mes, para no hacer nada.
  #
  # Cada 5 minutos. GitHub puede retrasar las ejecuciones programadas cuando hay
  # mucha carga, asi que el retardo real ronda los 5-15 minutos.
  # schedule:
  #   - cron: '*/5 * * * *'

  # Para poder lanzarlo a mano desde la pestana Actions sin esperar al reloj.
  workflow_dispatch:
    inputs:
      simular:
        description: 'Analizar sin escribir nada en la base de datos'
        type: boolean
        default: false

# Si una ejecucion se solapa con la anterior, se descarta: dos workers a la vez
# procesarian los mismos viajes.
concurrency:
  group: verificar-viajes
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Regenerar datos compartidos
        run: node scripts/build-estaciones.js

      - name: Procesar la cola
        working-directory: backend
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          # Mientras no haya credenciales no hay nada que verificar, y el cron
          # se despierta igual. Sin esta salida limpia, cada ejecucion cuenta
          # como fallo y manda un correo: son ~288 al dia.
          #
          # El worker SI debe morir con error si le falta la credencial (lo hace
          # en worker.js): decidir que el proyecto todavia no esta configurado
          # es cosa del workflow, no suya.
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::Sin FIREBASE_SERVICE_ACCOUNT: no hay cola que procesar. Crea los secretos (README, apartado 3)."
            exit 0
          fi
          node worker.js ${{ inputs.simular && '--simular' || '' }}

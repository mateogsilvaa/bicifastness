  controlabamos.

  Cuadro de 24, trazo 1,5, sin relleno y en `currentColor`: heredan el color del
  texto, asi que funcionan en tema claro y oscuro sin una sola regla extra.

  Uso:  <svg class="icono" aria-hidden="true"><use href="/assets/img/iconos.svg#subir"></use></svg>
  Si el icono es la unica etiqueta de un control, el control necesita
  `aria-label`: el <svg> va siempre `aria-hidden`.
-->


name: Medir el OCR

# Mide cuanto acierta el OCR sobre las capturas reales que ya hay en Firestore.
#
# Corre aqui y no en un portatil porque es donde vive la credencial, y sobre
# todo porque asi las capturas NO salen de la base de datos: son trayectos de
# personas reales. De este workflow solo sale un informe con numeros.
#
# Se lanza a mano cuando se toca `backend/src/ocr.js`, para saber si un cambio
# mejora o empeora en vez de ajustarlo a ojo (issues #10 y #16).

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Cuantas capturas medir'
        type: string
        default: '40'
      todos:
        description: 'Tambien rechazados y en revision, con el veredicto de hoy'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Regenerar datos compartidos
        run: node scripts/build-estaciones.js

      - name: Medir
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Por variable y no pegado en el script: `limite` es texto libre, y
          # `${{ }}` dentro de `run` se sustituye ANTES de que lo lea bash, asi
          # que un `"; curl ...` ahi se ejecutaba con el secreto a mano.
          LIMITE: ${{ inputs.limite }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Sin FIREBASE_SERVICE_ACCOUNT no hay capturas que medir."
            exit 1
          fi
          case "$LIMITE" in ''|*[!0-9]*) echo "::error::El limite tiene que ser un numero."; exit 1 ;; esac
          node scripts/medir-ocr.js --limite "$LIMITE" --salida informe-ocr.json ${{ inputs.todos && '--todos' || '' }}

      # El informe lleva solo recuentos y porcentajes: ni ids de viaje (llevan
      # el uid), ni imagenes, ni nada de lo leido. El repositorio es publico, asi
      # que ni el log ni este artefacto pueden llevar datos de nadie.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-ocr
          path: informe-ocr.json
          retention-days: 14

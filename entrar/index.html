<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://unpkg.com 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src https://www.google.com https://bicifastness.firebaseapp.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Entra en tu cuenta de BiciFastness.">
<meta name="robots" content="noindex">
<title>Iniciar sesion | BiciFastness</title>
<link rel="icon" href="/images/logo.png" type="image/png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/images/icono/icono-180.png">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<a href="#principal" class="saltar-contenido">Saltar al contenido</a>

<main class="container estrecho" id="principal">
  <a class="fila" href="/" style="text-decoration: none; margin-bottom: var(--e6);">
    <img src="/images/logo.png" alt="" width="32" height="32">
    <span class="h2" style="margin: 0;">BiciFastness</span>
  </a>

  <h1 class="h1">Iniciar sesion</h1>

  <form id="form-login" novalidate>
    <div class="campo">
      <label for="email">Correo electronico</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
    </div>

    <div class="campo">
      <label for="password">Contrasena</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn" id="btn-entrar">Entrar</button>
    <p class="mensaje" id="mensaje" aria-live="polite"></p>
  </form>

  <div class="pila" style="margin-top: var(--e5);">
    <button type="button" class="btn plano" id="btn-recuperar">He olvidado mi contrasena</button>
    <p class="menor">
      <a href="/register/">No tengo cuenta, quiero registrarme</a>
    </p>
    <p class="menor apagado">
      Tambien puedes <a href="/clasificacion/">ver la clasificacion</a> sin cuenta.
    </p>
  </div>
</main>

<footer id="pie-legal"></footer>

<script type="module" src="/assets/js/paginas/entrar.js"></script>
</body>
</html>

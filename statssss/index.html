<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn-uicons.flaticon.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdn-uicons.flaticon.com; img-src 'self' data: blob: https://api.dicebear.com https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src https://www.google.com https://bicifastness.firebaseapp.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Estadisticas publicas de BiciFastness.">
<title>Estadisticas | BiciFastness</title>
<link rel="icon" href="/images/logo.png" type="image/png">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<style>
  .container { max-width: 900px; text-align: center; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; margin-top: 30px; }
  .cifra { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radio-xl); padding: 30px 20px; }
  .cifra i { font-size: 2rem; color: var(--primary); display: block; margin-bottom: 12px; }
  .cifra strong { display: block; font-size: 2.4rem; font-weight: 900; }
  .cifra span { font-size: .82rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
</style>
</head>
<body>
<a href="#principal" class="saltar-contenido">Saltar al contenido</a>
<nav id="nav-principal"></nav>
<div class="bottom-nav" id="nav-inferior"></div>

<main class="container" id="principal">
  <h2>Estadisticas</h2>
  <p class="mensaje" id="mensaje">Cargando...</p>

  <div class="rejilla" id="rejilla" hidden>
    <div class="cifra">
      <i class="fi fi-sr-users"></i>
      <strong id="c-pilotos">-</strong>
      <span>Pilotos registrados</span>
    </div>
    <div class="cifra">
      <i class="fi fi-sr-route"></i>
      <strong id="c-viajes">-</strong>
      <span>Tiempos verificados</span>
    </div>
    <div class="cifra">
      <i class="fi fi-sr-shield-check"></i>
      <strong id="c-clanes">-</strong>
      <span>Clanes activos</span>
    </div>
    <div class="cifra">
      <i class="fi fi-sr-map-marker"></i>
      <strong id="c-estaciones">-</strong>
      <span>Estaciones conquistadas</span>
    </div>
  </div>
</main>

<footer id="pie-legal"></footer>

<script type="module" src="/assets/js/paginas/statssss.js"></script>
</body>
</html>

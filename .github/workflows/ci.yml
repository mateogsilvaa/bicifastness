name: Tests y despliegue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A mano, para abrir o cerrar la web tras cambiar la variable WEB_ABIERTA.
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar utillaje
        run: npm install --no-audit --no-fund

      # Detecta variables fuera de ambito en el JavaScript incrustado en las
      # paginas, que es codigo que ninguna otra herramienta del proyecto mira.
      - name: Analisis estatico
        run: npm run lint

      # Enlaces e imports rotos: el HTML sigue siendo valido y los tests pasan,
      # asi que sin esto se cuelan al mover ficheros de sitio.
      - name: Validar paginas
        run: npm run validar

      - name: Instalar dependencias del worker
        working-directory: backend
        run: npm ci

      # TODOS los generadores deterministas, no solo el de estaciones. Con uno
      # solo, la comprobacion de abajo cazaba a quien editaba a mano un fichero
      # generado, pero NO a quien editaba la FUENTE y se olvidaba de regenerar:
      # ahi el generado sigue coincidiendo con lo que hay en git, el diff sale
      # limpio, y el catalogo de insignias que ven el navegador y el worker se
      # queda con los textos viejos.
      #
      # Va DESPUES de instalar las dependencias del worker: `build-push.js` lee
      # los tipos de aviso de `backend/src/push.js`, que carga `web-push`.
      #
      # `build-version.js` se queda fuera a proposito: escribe el SHA del commit,
      # asi que siempre difiere y haria fallar la comprobacion. Lo lanza el
      # trabajo `web` en cada despliegue, que es cuando importa.
      - name: Regenerar datos compartidos
        run: npm run datos:fuente

      # Si los generados no coinciden con sus fuentes, o alguien ha editado a
      # mano un fichero generado, el frontend y el backend van a divergir.
      - name: Comprobar que los datos generados estan al dia
        run: git diff --exit-code assets/data backend/lib

      # El modelo de coste (#34) dice cuantas lecturas de Firestore cuesta cada
      # operacion, y el plan Spark corta en 50.000 al dia: al agotarlas la web
      # no va lenta, deja de funcionar hasta medianoche.
      #
      # Corria solo a mano, en la revision mensual, asi que un cambio que
      # disparase una operacion no se notaba hasta que alguien se acordara de
      # lanzarlo. Aqui falla en el sitio, en el commit que lo causa.
      #
      # `--comprobar` no mira el total —ese depende de cuanta gente entre, y ya
      # se sabe que u200 se pasa— sino si alguna operacion SUELTA se come la
      # cuota diaria ella sola. Eso siempre es un fallo.
      - name: Comprobar el coste en lecturas
        run: node scripts/auditar-lecturas.js --comprobar

      # Y que las tablas de docs/COSTE.md sean las que sale del modelo: se
      # copiaban a mano y el documento acabo con tres tablas de escenarios y
      # tres totales distintos.
      - name: Comprobar que docs/COSTE.md esta al dia
        run: |
          node scripts/auditar-lecturas.js --escribir
          git diff --exit-code docs/COSTE.md

      # El banco de capturas (#16) ejecuta el OCR de verdad, y tesseract se baja
      # varios megas de modelo de idioma la primera vez.
      - name: Cache del idioma del OCR
        uses: actions/cache@v4
        with:
          path: backend/.tesseract
          key: tesseract-spa-${{ runner.os }}

      - name: Tests
        working-directory: backend
        run: |
          set -o pipefail
          npm test | tee "$RUNNER_TEMP/tests.log"

      # El porcentaje de extraccion del banco, a la vista en el resumen del PR:
      # es el numero que dice si un cambio en el extractor mejora o empeora, y
      # enterrado en el log no lo mira nadie.
      - name: Banco de capturas en el resumen
        if: always()
        run: |
          if grep -q "Extraccion del banco" "$RUNNER_TEMP/tests.log"; then
            {
              echo "### Banco de capturas"
              grep -A 13 "Extraccion del banco" "$RUNNER_TEMP/tests.log" | sed 's/^/    /'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "El banco de capturas no ha llegado a medirse (OCR no disponible)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Las reglas EJECUTADAS contra el emulador, no leidas como texto. El freno de
  # subidas (#62) gatea cada viaje: una expresion mal escrita no deja pasar de
  # mas, deja a TODO EL MUNDO sin poder subir. Hasta que existio esto no se
  # habia ejecutado nunca antes de llegar a produccion.
  #
  # Va en su propio trabajo porque el emulador necesita Java 21 y firebase-tools,
  # que pesan demasiado para la suite normal.
  reglas-emulador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: test-reglas/package-lock.json
      - name: Cache del emulador
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulador-firestore-${{ hashFiles('test-reglas/package-lock.json') }}
      - name: Pruebas de las reglas
        working-directory: test-reglas
        run: |
          npm ci --no-audit --no-fund
          npm test

  # Las REGLAS y los INDICES de Firestore no son estaticos: son el control de
  # acceso del proyecto (no hay servidor delante) y se despliegan en cada push.
  reglas:
    # Nunca se despliega una regla que no haya pasado por el emulador.
    needs: [tests, reglas-emulador]
    # Tambien al lanzarlo a mano (Run workflow): si no, un despliegue fallido
    # solo se podia reintentar con un commit nuevo, y los indices que necesita
    # el worker se quedaban sin crear.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Desplegar reglas e indices de Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/cuenta-servicio.json
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Sin FIREBASE_SERVICE_ACCOUNT: me salto el despliegue."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > cuenta-servicio.json
          npm install -g firebase-tools

          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project bicifastness --non-interactive

          rm -f cuenta-servicio.json

  # LA WEB, en GitHub Pages. Solo desde `main` y solo si han pasado las pruebas
  # y las reglas: nunca se publica algo que no las pasa.
  #
  # Settings → Pages → Source: "GitHub Actions". El dominio propio se pone en
  # Settings → Pages → Custom domain (y en el fichero CNAME, que es de donde lo
  # sacan los enlaces de los correos).
  #
  # Abierta o en obras segun la variable del repositorio WEB_ABIERTA (Settings →
  # Secrets and variables → Actions → Variables). Sin ella, EN OBRAS. Para
  # cambiarla sin commit: cambia la variable y Actions → "Tests y despliegue" →
  # Run workflow (scripts/construir-sitio.js).
  web:
    needs: [tests, reglas-emulador]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    # Dos publicaciones a la vez se pisan: la segunda espera.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Montar la web
        env:
          WEB_ABIERTA: ${{ vars.WEB_ABIERTA }}
        run: |
          node scripts/build-version.js
          node scripts/construir-sitio.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn-uicons.flaticon.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdn-uicons.flaticon.com; img-src 'self' data: blob: https://api.dicebear.com https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src https://www.google.com https://bicifastness.firebaseapp.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="BiciFastness: compite con tus tiempos de BiciMAD por Madrid.">
<title>Iniciar sesion | BiciFastness</title>
<link rel="icon" href="/images/logo.png" type="image/png">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<style>
  body { justify-content: center; align-items: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 380px; text-align: center; }
  .marca {
    display: inline-flex; align-items: center; gap: 9px; margin-bottom: 4px;
  }
  .marca span {
    width: 7px; height: 26px; border-radius: 4px;
    background: linear-gradient(180deg, var(--primary-claro), var(--primary));
    box-shadow: 0 0 16px rgba(30,144,255,.7);
  }
  h1 {
    font-size: 1.55rem; color: var(--text-main); margin: 0;
    letter-spacing: .01em; font-stretch: 88%;
  }
  .sub {
    color: var(--text-tenue); font-family: var(--fuente-mono); font-size: .68rem;
    text-transform: uppercase; letter-spacing: .2em; margin: 0 0 26px;
  }
  input { margin: 9px 0; text-align: left; }
  .enlace {
    display: block; margin-top: 14px; font-size: .85rem;
    color: var(--text-muted); text-decoration: none; font-weight: 600;
    transition: color var(--transicion);
  }
  .enlace:hover { color: var(--primary-claro); }
  .invitado {
    display: block; margin-top: 18px; font-size: .88rem; font-weight: 700;
    color: var(--primary-claro); text-decoration: none; padding: 13px;
    border: 1px solid var(--border-fuerte); border-radius: var(--radio-s);
    transition: all var(--transicion);
  }
  .invitado:hover { background: var(--primary-tenue); border-color: var(--primary); }
  #pie-legal { border: none; margin-top: 26px; padding: 0; }
</style>
</head>
<body>
<main class="card">
  <div class="marca"><span></span><h1>BiciFastness</h1></div>
  <p class="sub">Iniciar sesion</p>

  <form id="form-login" novalidate>
    <label class="solo-lectores" for="email">Correo electronico</label>
    <input type="email" id="email" name="email" placeholder="Correo electronico"
           autocomplete="email" required>

    <label class="solo-lectores" for="password">Contrasena</label>
    <input type="password" id="password" name="password" placeholder="Contrasena"
           autocomplete="current-password" required>

    <button type="submit" id="btn-entrar">Entrar</button>
  </form>

  <p class="mensaje" id="mensaje"></p>

  <a href="#" class="enlace" id="btn-recuperar">He olvidado mi contrasena</a>
  <a href="/register/" class="enlace">No tengo cuenta. Quiero registrarme</a>
  <a href="/home/" class="invitado">Explorar sin cuenta</a>

  <footer id="pie-legal"></footer>
</main>

<script type="module" src="/assets/js/paginas/entrar.js"></script>
</body>
</html>

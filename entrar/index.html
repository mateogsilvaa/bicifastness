<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://apis.google.com 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://api.citybik.es; frame-src https://www.google.com https://bicifastness.firebaseapp.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Entra en tu cuenta de BiciFastness.">
<meta name="robots" content="noindex">
<title>Entrar | BiciFastness</title>
<link rel="icon" href="/images/icono/icono.svg" type="image/svg+xml">
<link rel="icon" href="/images/icono/icono-48.png" sizes="48x48" type="image/png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F10" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/images/icono/icono-180.png">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="con-marca">
<a href="#principal" class="saltar-contenido">Saltar al contenido</a>

<!-- 01 Acceso · 1d. Google primero. Los errores de Firebase, traducidos, y
     nunca se dice si un correo tiene cuenta o no. -->
<!-- 08 · 8e: en escritorio, panel azul fijo a la izquierda y el formulario
     de 400 px a la derecha. En movil no se ve. -->
<aside class="acceso-marca" aria-hidden="true">
  <span class="logo">
    <svg class="logo-anillo blanco" viewBox="0 0 24 24" width="30" height="30" focusable="false">
      <rect width="24" height="24" rx="6.5"></rect>
      <path d="M12 5 A7 7 0 1 1 5.94 8.5"></path>
      <circle cx="5.94" cy="8.5" r="2.1"></circle>
    </svg>
    <span class="logo-palabra">bicifastness</span>
  </span>
  <svg class="acceso-marca-anillo" viewBox="0 0 24 24" width="220" height="220" focusable="false"><path d="M12 5 A7 7 0 1 1 5.94 8.5"></path><circle cx="5.94" cy="8.5" r="2.1"></circle></svg>
  <span class="acceso-marca-titulo">Una vuelta<br>cada día.</span>
  <span class="acceso-marca-texto">Cada día que subes un trayecto, tu racha crece y tus puntos se multiplican hasta ×1,5.</span>
  <span class="acceso-marca-aviso">Proyecto independiente. Sin relación con BiciMAD ni la EMT.</span>
</aside>
<main class="acceso" id="principal">
  <div class="acceso-barra">
    <a class="boton-icono" href="/" aria-label="Volver a la portada" id="volver"></a>
  </div>

  <div class="acceso-cuerpo">
    <svg class="logo-anillo" viewBox="0 0 24 24" width="40" height="40" aria-hidden="true" focusable="false">
      <rect width="24" height="24" rx="6.5"></rect>
      <path d="M12 5 A7 7 0 1 1 5.94 8.5"></path>
      <circle cx="5.94" cy="8.5" r="2.1"></circle>
    </svg>

    <h1 class="acceso-titulo">Hola de nuevo</h1>

    <button type="button" class="btn-google" id="btn-google">
      <img src="/images/google.svg" alt="" width="20" height="20">
      <span>Continuar con Google</span>
    </button>
    <p class="acceso-error" id="mensaje-google" aria-live="polite"></p>

    <div class="separador-o" aria-hidden="true"><span>o con tu correo</span></div>

    <form id="form-login" class="acceso-form" novalidate>
      <div class="campo-acceso">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
      </div>

      <div class="campo-acceso">
        <label for="password">Contraseña</label>
        <div class="con-ojo">
          <input id="password" name="password" type="password" autocomplete="current-password"
                 required aria-describedby="mensaje">
          <button type="button" class="ojo" id="ver-clave" aria-label="Mostrar la contraseña" aria-pressed="false"></button>
        </div>
        <p class="acceso-error izquierda" id="mensaje" aria-live="polite"></p>
      </div>

      <button type="submit" class="btn grande" id="btn-entrar">Entrar</button>
    </form>

    <button type="button" class="btn plano" id="btn-recuperar">He olvidado mi contraseña</button>

    <div class="acceso-hueco"></div>
    <p class="acceso-pie">¿Sin cuenta? <a href="/register/">Crear una</a></p>
  </div>
</main>

<script type="module" src="/assets/js/paginas/entrar.js"></script>
</body>
</html>

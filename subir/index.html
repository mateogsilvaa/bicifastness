<!--
  03 Subir. De "acabo de dejar la bici" a "subido" en dos toques y sin escribir:
  el + abre el selector de fotos, la lectura en el navegador rellena todo y la
  persona solo confirma. Cada paso es una seccion; se ve una cada vez. Todo el
  contenido lo pinta subir.js: aqui solo estan los huecos.
-->
<main class="subir" id="principal">
  <h1 class="solo-lectores">Subir trayecto</h1>
  <section id="s-inicio" class="subir-paso" aria-label="Subir trayecto"></section>
  <section id="s-avisos" class="subir-paso oculto" aria-label="Antes de leerla"></section>
  <section id="s-leyendo" class="subir-paso leyendo oculto" aria-label="Leyendo la captura" aria-live="polite"></section>
  <section id="s-confirmar" class="subir-paso oculto" aria-label="Revisa y sube"></section>
  <section id="s-manual" class="subir-paso oculto" aria-label="Complétalo tú"></section>
  <section id="s-varios" class="subir-paso oculto" aria-label="Varios trayectos"></section>
  <section id="s-subido" class="subir-paso oculto" aria-label="Subido" aria-live="polite"></section>
  <input id="foto" type="file" accept="image/jpeg,image/png,image/webp,image/*" multiple class="solo-lectores" tabindex="-1" aria-label="Elegir captura">
  <img id="vista-lectura" class="oculto" alt="">
</main>

<footer id="pie-legal"></footer>
<div id="nav-inferior"></div>

<script type="module" src="/assets/js/paginas/subir.js"></script>
</body>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://apis.google.com https://unpkg.com 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://api.citybik.es; frame-src https://www.google.com https://bicifastness.firebaseapp.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Elegir una contraseña nueva o confirmar el correo de tu cuenta de BiciFastness.">
<meta name="robots" content="noindex">
<title>Tu cuenta | BiciFastness</title>
<link rel="icon" href="/images/logo.png" type="image/png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F10" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/images/icono/icono-180.png">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="sin-navegacion">
<a href="#principal" class="saltar-contenido">Saltar al contenido</a>
<header class="cabeza-mensaje">
  <a class="logo" href="/" aria-label="bicifastness">
    <svg class="logo-anillo" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
      <rect width="24" height="24" rx="6.5"></rect>
      <path d="M12 5 A7 7 0 1 1 5.94 8.5"></path>
      <circle cx="5.94" cy="8.5" r="2.1"></circle>
    </svg>
    <span class="logo-palabra">bicifastness</span>
  </a>
</header>
<!-- 10f: el enlace de los correos de Firebase (contraseña y verificacion) aterriza aqui. -->
<main class="pagina-mensaje centrada" id="principal">
  <span class="chip pendiente" id="estado">Comprobando el enlace…</span>
  <h1 id="titulo">Tu cuenta</h1>
  <p class="texto-mensaje" id="mensaje" aria-live="polite"></p>

  <form id="form-clave" class="acceso-form oculto" novalidate>
    <div class="campo-acceso">
      <label for="clave">Contraseña nueva</label>
      <div class="con-ojo">
        <input id="clave" name="clave" type="password" autocomplete="new-password" required minlength="8"
               aria-describedby="fuerza-clave error-clave">
        <button type="button" class="ojo" id="ver-clave" aria-label="Mostrar la contraseña" aria-pressed="false"></button>
      </div>
      <div class="fuerza-clave" id="fuerza-clave" aria-live="polite"></div>
      <p class="acceso-error izquierda" id="error-clave" aria-live="polite"></p>
    </div>
    <button type="submit" class="btn grande" id="guardar">Guardar contraseña</button>
  </form>

  <div class="acciones-mensaje">
    <a class="btn grande secundario" id="volver" href="/entrar/">Ir a entrar</a>
  </div>
</main>

<script type="module" src="/assets/js/paginas/cuenta.js"></script>
</body>
</html>

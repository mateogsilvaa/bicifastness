<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self'; img-src 'self' data: blob: https://api.dicebear.com https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src https://www.google.com https://bicifastness.firebaseapp.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Clanes de BiciFastness: unete a un equipo y conquista estaciones de Madrid.">
<title>Clanes | BiciFastness</title>
<link rel="icon" href="/images/logo.png" type="image/png">
<link rel="stylesheet" href="/assets/css/app.css">
<style>
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 20px; }
  .clan { background: var(--bg-card); border: 1px solid var(--border); border-left: 5px solid var(--primary); border-radius: var(--radio); padding: 18px; }
  .clan h3 { margin: 0 0 6px; font-size: 1.05rem; }
  .clan p { margin: 0 0 10px; font-size: .82rem; color: var(--text-muted); line-height: 1.5; }
  .clan-cifras { display: flex; gap: 16px; font-size: .78rem; color: var(--text-muted); margin-bottom: 12px; }
  .clan-cifras strong { color: var(--primary); }
  .miembro { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--bg-input); border-radius: var(--radio-s); padding: 10px 14px; margin-bottom: 8px; font-size: .88rem; }
  .miembro button { width: auto; margin: 0; padding: 6px 12px; font-size: .75rem; background: transparent; border: 1px solid var(--error); color: var(--error); }
  .pestanas { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .pestanas button { width: auto; margin: 0; padding: 10px 18px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); font-size: .88rem; }
  .pestanas button.activa { border-color: var(--primary); color: var(--primary); }
  .lider { font-size: .7rem; background: rgba(255,207,61,.15); color: var(--oro); padding: 2px 8px; border-radius: 10px; }

  .clan { transition: transform var(--transicion), border-color var(--transicion); box-shadow: var(--sombra-media); }
  .clan:hover { transform: translateY(-2px); border-color: var(--border-fuerte); }
  .clan-cifras strong { font-family: var(--fuente-mono); font-variant-numeric: tabular-nums; }
  .pestanas button { border-radius: 100px; transition: all var(--transicion); }
  .pestanas button.activa { background: var(--primary-tenue); }
</style>
</head>
<body>
<a href="#principal" class="saltar-contenido">Saltar al contenido</a>
<nav id="nav-principal"></nav>
<div class="bottom-nav" id="nav-inferior"></div>

<main class="container" id="principal">
  <h2>Clanes</h2>

  <div class="pestanas" role="tablist">
    <button id="tab-lista" class="activa">Todos los clanes</button>
    <button id="tab-mio">Mi clan</button>
    <button id="tab-crear">Crear clan</button>
  </div>

  <p class="mensaje" id="mensaje"></p>

  <section id="vista-lista"></section>
  <section id="vista-mio" class="oculto"></section>

  <section id="vista-crear" class="oculto">
    <div class="card">
      <h2>Fundar un clan</h2>
      <div class="form-group">
        <label for="nombre-clan">Nombre del clan</label>
        <input type="text" id="nombre-clan" maxlength="28" placeholder="Los Rayos de Madrid">
      </div>
      <div class="form-group">
        <label for="desc-clan">Descripcion</label>
        <input type="text" id="desc-clan" maxlength="160" placeholder="Rapidos por el centro">
      </div>
      <div class="form-group">
        <label for="color-clan">Color en el mapa</label>
        <input type="color" id="color-clan" value="#0071c3" style="height: 48px; padding: 4px;">
      </div>
      <button id="btn-crear">Crear clan</button>
      <p class="mensaje" id="msg-crear"></p>
    </div>
  </section>
</main>

<footer id="pie-legal"></footer>

<script type="module" src="/assets/js/paginas/clanes.js"></script>
</body>
</html>

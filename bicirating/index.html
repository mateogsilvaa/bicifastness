<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="BiciRating: clasificacion global de pilotos y clanes de BiciFastness.">
<title>BiciRating | BiciFastness</title>
<link rel="icon" href="/images/logo.png" type="image/png">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<style>
  .pestanas { display: flex; gap: 10px; margin: 20px 0; }
  .pestanas button { width: auto; margin: 0; padding: 10px 20px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); }
  .pestanas button.activa { border-color: var(--primary); color: var(--primary); }
  .fila { display: flex; align-items: center; gap: 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radio); padding: 12px 16px; margin-bottom: 10px; }
  .fila.p1 { border-color: var(--oro); }
  .fila.p2 { border-color: var(--plata); }
  .fila.p3 { border-color: var(--bronce); }
  .puesto { font-weight: 900; min-width: 40px; color: var(--text-muted); font-size: 1.1rem; }
  .fila.p1 .puesto { color: var(--oro); }
  .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--bg-input); }
  .nombre { flex: 1; min-width: 0; }
  .nombre strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nombre span { font-size: .75rem; color: var(--text-muted); }
  .puntos { font-weight: 800; color: var(--primary); font-size: 1.05rem; }
  .marca-clan { width: 6px; height: 42px; border-radius: 3px; background: var(--primary); }

  .fila { transition: transform var(--transicion), border-color var(--transicion); }
  .fila:hover { transform: translateX(2px); border-color: var(--border-fuerte); }
  .puesto, .puntos { font-family: var(--fuente-mono); font-variant-numeric: tabular-nums; }
  .puntos { font-size: 1.08rem; letter-spacing: -.03em; }
  .fila.p1 { background: linear-gradient(100deg, rgba(255,207,61,.07), transparent 55%), var(--bg-card); }
  .pestanas button { border-radius: 100px; transition: all var(--transicion); }
  .pestanas button.activa { background: var(--primary-tenue); }
</style>
</head>
<body>
<a href="#principal" class="saltar-contenido">Saltar al contenido</a>
<nav id="nav-principal"></nav>
<div class="bottom-nav" id="nav-inferior"></div>

<main class="container" id="principal">
  <h2>BiciRating</h2>
  <p style="color: var(--text-muted); font-size: .9rem; max-width: 640px;">
    Cada viaje verificado suma 5 puntos, y quedar entre los siete primeros de una
    ruta suma segun el puesto. La ruta destacada de la temporada puntua el doble.
  </p>

  <div class="pestanas">
    <button id="tab-pilotos" class="activa">Pilotos</button>
    <button id="tab-clanes">Clanes</button>
  </div>

  <p class="mensaje" id="mensaje"></p>
  <div id="lista"></div>
</main>

<footer id="pie-legal"></footer>

<script type="module">
  import { db, collection, getDocs } from '/assets/js/firebase.js';
  import { iniciarPagina } from '/assets/js/ui.js';
  import { id, el, estado, reemplazar, imagen } from '/assets/js/dom.js';

  iniciarPagina('bicirating');

  let pilotos = [];
  let clanes = [];
  let vista = 'pilotos';

  cargar();

  async function cargar() {
    estado(id('mensaje'), 'Cargando clasificacion...');
    try {
      // Lectura publica directa de Firestore. Antes venia de PocketBase a traves
      // de un tunel de ngrok, que ademas era un punto unico de fallo.
      const [usuariosSnap, clanesSnap] = await Promise.all([
        getDocs(collection(db, 'usuarios')),
        getDocs(collection(db, 'clanes')),
      ]);

      pilotos = usuariosSnap.docs
        .map((d) => ({ uid: d.id, ...d.data() }))
        .filter((u) => !u.suspendido)
        .sort((a, b) => (b.biciRating || 0) - (a.biciRating || 0));

      clanes = clanesSnap.docs
        .map((d) => ({ clanId: d.id, ...d.data() }))
        .sort((a, b) => (b.biciRating || 0) - (a.biciRating || 0));

      estado(id('mensaje'), '');
      pintar();
    } catch (error) {
      estado(id('mensaje'), `No se ha podido cargar la clasificacion: ${error.message}`, 'error');
    }
  }

  function pintar() {
    const datos = vista === 'pilotos' ? pilotos : clanes;

    if (!datos.length) {
      reemplazar(id('lista'), el('p', {
        texto: 'Todavia no hay nadie clasificado.',
        estilo: { color: 'var(--text-muted)', textAlign: 'center', padding: '30px' },
      }));
      return;
    }

    reemplazar(id('lista'), datos.slice(0, 100).map((item, indice) => {
      const puesto = indice + 1;
      const clase = `fila ${puesto <= 3 ? `p${puesto}` : ''}`;

      if (vista === 'pilotos') {
        const nombre = item.username || 'Piloto';
        return el('div', { clase }, [
          el('div', { clase: 'puesto', texto: `#${puesto}` }),
          imagen(item.avatarUrl || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(nombre)}&backgroundColor=0071c3`,
            { clase: 'avatar', attrs: { alt: '', loading: 'lazy' } }),
          el('div', { clase: 'nombre' }, [
            el('strong', { texto: nombre }),
            el('span', { texto: `${item.viajesVerificados || 0} viajes verificados` }),
          ]),
          el('div', { clase: 'puntos', texto: String(item.biciRating || 0) }),
        ]);
      }

      const marca = el('div', { clase: 'marca-clan' });
      marca.style.background = item.color || 'var(--primary)';

      return el('div', { clase }, [
        el('div', { clase: 'puesto', texto: `#${puesto}` }),
        marca,
        el('div', { clase: 'nombre' }, [
          el('strong', { texto: item.nombre || item.clanId }),
          el('span', { texto: `${item.numMiembros ?? (item.miembros || []).length} miembros` }),
        ]),
        el('div', { clase: 'puntos', texto: String(item.biciRating || 0) }),
      ]);
    }));
  }

  for (const cual of ['pilotos', 'clanes']) {
    id(`tab-${cual}`).addEventListener('click', () => {
      vista = cual;
      id('tab-pilotos').classList.toggle('activa', cual === 'pilotos');
      id('tab-clanes').classList.toggle('activa', cual === 'clanes');
      pintar();
    });
  }
</script>
</body>
</html>

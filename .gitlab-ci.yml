image: node:18-bookworm

stages:
  - deploy

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r ./* public/
    - rm -rf public/.git public/public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy_functions:
  stage: deploy
  script:
    - npm install -g firebase-tools
    - cd functions
    - npm install
    - firebase deploy --only functions --token "$FIREBASE_TOKEN"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

name: Publicar en GitHub Pages

# Publica el sitio estatico. Sustituye al despliegue en Firebase Hosting.
#
# El frontend es HTML + modulos ES sin build y habla con Firestore desde el
# navegador, asi que a Pages solo le toca servir ficheros. Lo que se pierde
# respecto a Hosting son las CABECERAS HTTP: Pages no permite configurarlas.
# La CSP y el Referrer-Policy viajan ahora en <meta> (`shared/csp.json`), y el
# antiframing lo hace `assets/js/ui.js`. Ver issue #3.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. No se cancela el que ya esta corriendo: dejar el
# sitio a medias es peor que esperar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `assets/data/` esta generado y no versionado: sin esto, el sitio se
      # publica sin la lista de estaciones.
      - name: Regenerar datos compartidos
        run: node scripts/build-estaciones.js

      - name: Comprobar que la CSP esta al dia en todas las paginas
        run: node scripts/aplicar-csp.js --comprobar

      - name: Montar el sitio
        env:
          MANTENIMIENTO: ${{ vars.MANTENIMIENTO }}
        run: |
          mkdir -p _sitio

          if [ "$MANTENIMIENTO" = "true" ]; then
            # Se publica SOLO la pagina de obras, y ademas como 404: Pages sirve
            # 404.html ante cualquier ruta que no exista, asi que al no subir
            # nada mas, ninguna URL antigua sigue accesible. Un redirect no
            # bastaria, porque Pages sirve primero el fichero que exista.
            echo "::notice::Modo mantenimiento: se publica solo la pagina de obras."
            cp mantenimiento/index.html _sitio/index.html
            cp mantenimiento/index.html _sitio/404.html
          else
            rsync -a ./ _sitio/ \
              --exclude '.git' \
              --exclude '.github' \
              --exclude 'node_modules' \
              --exclude '_sitio' \
              --exclude 'backend' \
              --exclude 'scripts' \
              --exclude 'shared' \
              --exclude 'docs' \
              --exclude '*.md' \
              --exclude 'package.json' \
              --exclude 'package-lock.json' \
              --exclude 'eslint.config.mjs' \
              --exclude 'firebase*.json' \
              --exclude 'firestore.*' \
              --exclude 'vercel.json' \
              --exclude '.vercelignore' \
              --exclude '.gitignore' \
              --exclude '.gitconfig'
          fi

          # Sin esto, Pages pasa el sitio por Jekyll y descarta los directorios
          # y ficheros que empiecen por guion bajo.
          touch _sitio/.nojekyll

          echo "--- publicado ---"
          find _sitio -maxdepth 1 | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - id: despliegue
        uses: actions/deploy-pages@v4

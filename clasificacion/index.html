<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://apis.google.com 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://api.citybik.es; frame-src https://www.google.com https://bicifastness.firebaseapp.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Clasificacion de BiciFastness: mejores tiempos por ruta, pilotos y clanes de BiciMAD en Madrid.">
<title>Ranking | BiciFastness</title>
<link rel="icon" href="/images/icono/icono.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/images/icono/icono-48.png?v=2" sizes="48x48" type="image/png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F10" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/images/icono/icono-180.png?v=2">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<a href="#principal" class="saltar-contenido">Saltar al contenido</a>
<nav id="nav-principal"></nav>

<!--
  04 Ranking. Se abre en TU grupo de division, no en la tabla de toda la
  ciudad: el puesto 180 de 400 no motiva; el 7.º de 30 a dos trayectos de
  subir, si. Tres pestañas: Pilotos, Rutas, Clanes. Todo publico sin sesion.
  ?tab=rutas|clanes, ?ruta=124-115 abre el detalle, ?modo=fondo, ?ambito=madrid.
-->
<main class="container ranking" id="principal">
  <header class="ranking-invitado oculto" id="cabeza-invitado">
    <a class="logo" href="/" aria-label="bicifastness">
      <svg class="logo-anillo" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false">
        <rect width="24" height="24" rx="6.5"></rect>
        <path d="M12 5 A7 7 0 1 1 5.94 8.5"></path>
        <circle cx="5.94" cy="8.5" r="2.1"></circle>
      </svg>
      <span class="logo-palabra">bicifastness</span>
    </a>
    <a class="enlace-fuerte" href="/entrar/">Entrar</a>
  </header>

  <div class="ranking-cabeza">
    <div class="ranking-titulo">
      <h1>Ranking</h1>
      <span id="fin-temporada"></span>
    </div>
    <div class="segmento pestanas-ranking" role="tablist" aria-label="Qué clasificación ver">
      <button type="button" role="tab" id="tab-pilotos" aria-controls="panel-pilotos" aria-selected="true">Pilotos</button>
      <button type="button" role="tab" id="tab-rutas" aria-controls="panel-rutas" aria-selected="false">Rutas</button>
      <button type="button" role="tab" id="tab-clanes" aria-controls="panel-clanes" aria-selected="false">Clanes</button>
    </div>
  </div>

  <!-- PILOTOS: tu grupo o Madrid, y los cuatro modos del juego. -->
  <section id="panel-pilotos" role="tabpanel" aria-labelledby="tab-pilotos">
    <div class="chips-ranking" role="group" aria-label="Filtros">
      <button type="button" class="chip-filtro" id="ambito-grupo" data-ambito="grupo">Tu grupo</button>
      <button type="button" class="chip-filtro" id="ambito-madrid" data-ambito="madrid">Madrid</button>
      <span class="separador-chips" aria-hidden="true"></span>
      <button type="button" class="chip-modo" value="general">General</button>
      <button type="button" class="chip-modo" value="sprint">Sprint</button>
      <button type="button" class="chip-modo" value="fondo">Fondo</button>
      <button type="button" class="chip-modo" value="constancia">Constancia</button>
    </div>
    <p class="explica-modo" id="explica-modo"></p>
    <p class="mensaje" id="msg-pilotos" aria-live="polite"></p>
    <div id="tabla-pilotos"></div>
  </section>

  <!-- RUTAS: lista y detalle (en escritorio, las dos a la vez: 8i). -->
  <section id="panel-rutas" role="tabpanel" aria-labelledby="tab-rutas" class="oculto">
    <div class="rutas-rejilla">
      <div class="rutas-lista" id="rutas-lista"></div>
      <div class="ruta-detalle" id="ruta-detalle"></div>
    </div>
    <p class="mensaje" id="msg-rutas" aria-live="polite"></p>
  </section>

  <!-- CLANES -->
  <section id="panel-clanes" role="tabpanel" aria-labelledby="tab-clanes" class="oculto">
    <p class="mensaje" id="msg-clanes" aria-live="polite"></p>
    <div id="tabla-clanes"></div>
  </section>

  <div id="fila-fija" class="fila-fija oculto" aria-live="polite"></div>
</main>

<footer id="pie-legal"></footer>
<div id="nav-inferior"></div>

<script type="module" src="/assets/js/paginas/clasificacion.js"></script>
</body>
</html>

<body class="sin-desplazamiento">
<a href="#principal" class="saltar-contenido">Saltar al contenido</a>
<nav id="nav-principal"></nav>

<!--
  Aqui el mapa manda: ocupa la pantalla y la lista de clanes se apoya a un lado
  (escritorio) o se abre desde abajo (movil). Antes eran dos paginas, /mapa/ y
  /clanes/, y ninguna de las dos contaba la historia entera.
-->
<main id="principal" class="territorio">
  <h1 class="solo-lectores">Mapa y clanes</h1>
  <div id="mapa" role="application" aria-label="Mapa de dominio por estación"></div>

  <!-- Filtro rapido y centrar en ti (la ubicacion solo al pulsarlo). -->
  <div class="mapa-controles">
    <div class="segmento flotante" role="group" aria-label="Qué estaciones ver">
      <button type="button" data-filtro="todos" aria-pressed="true">Todos</button>
      <button type="button" data-filtro="miclan" aria-pressed="false">Mi clan</button>
      <button type="button" data-filtro="disputa" aria-pressed="false">En disputa</button>
    </div>
    <div class="mapa-botones">
      <!-- 11c: el buscador de bicis se abre desde aqui. -->
      <a class="boton-mapa con-texto" id="buscar-bici" href="/bici/" aria-label="Buscar bici"><span>Buscar bici</span></a>
      <button type="button" class="boton-mapa" id="centrar" aria-label="Centrar el mapa en mi ubicación"></button>
    </div>
  </div>
  <div class="mapa-zoom" role="group" aria-label="Zoom">
    <button type="button" class="boton-mapa" id="zoom-mas" aria-label="Acercar"></button>
    <button type="button" class="boton-mapa" id="zoom-menos" aria-label="Alejar"></button>
  </div>

  <!-- Movil: hoja inferior con tres alturas (asomada, media, completa).
       Escritorio (8k): panel flotante de 400 px a la izquierda. -->
  <aside class="hoja-mapa" id="hoja-mapa" data-altura="asomada" aria-label="Estaciones y clanes">
    <button type="button" class="asa-mapa" id="asa-mapa" aria-label="Ampliar el panel"><span></span></button>
    <div id="resumen-mapa" class="resumen-mapa"></div>
    <div class="cuerpo-hoja">
      <div class="segmento pestanas-mapa" role="tablist" aria-label="Vista del territorio">
        <button type="button" role="tab" id="tab-estaciones" aria-controls="panel-estaciones" aria-selected="true">Estación</button>
        <button type="button" role="tab" id="tab-clanes" aria-controls="panel-clanes" aria-selected="false">Clanes</button>
        <button type="button" role="tab" id="tab-miclan" aria-controls="panel-miclan" aria-selected="false">Mi clan</button>
      </div>
      <div id="panel-estaciones" role="tabpanel" aria-labelledby="tab-estaciones">
        <div id="ficha-estacion"></div>
      </div>
      <div id="panel-clanes" role="tabpanel" aria-labelledby="tab-clanes" class="oculto">
        <div id="lista-clanes"></div>
      </div>
      <div id="panel-miclan" role="tabpanel" aria-labelledby="tab-miclan" class="oculto"></div>
      <p class="mensaje" id="mensaje" aria-live="polite"></p>
    </div>
  </aside>
</main>

<div id="nav-inferior"></div>

<script src="/assets/vendor/leaflet/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="></script>

</body>
</html>

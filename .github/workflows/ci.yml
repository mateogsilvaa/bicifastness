name: Tests y despliegue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Regenerar datos compartidos
        run: node scripts/build-estaciones.js

      # Si los ficheros generados no coinciden con sus fuentes, alguien ha
      # editado a mano un fichero generado y el frontend y el backend van a
      # divergir.
      - name: Comprobar que los datos generados estan al dia
        run: git diff --exit-code assets/data backend/lib

      - name: Instalar utillaje
        run: npm install --no-audit --no-fund

      # Detecta variables fuera de ambito en el JavaScript incrustado en las
      # paginas, que es codigo que ninguna otra herramienta del proyecto mira.
      - name: Analisis estatico
        run: npm run lint

      # Enlaces e imports rotos: el HTML sigue siendo valido y los tests pasan,
      # asi que sin esto se cuelan al mover ficheros de sitio.
      - name: Validar paginas
        run: npm run validar

      - name: Instalar dependencias del worker
        working-directory: backend
        run: npm ci

      - name: Tests
        working-directory: backend
        run: npm test

  # El sitio lo publica Vercel, conectado a este repositorio. Aqui solo quedan las
  # REGLAS y los INDICES de Firestore, que no son estaticos: son el control de
  # acceso del proyecto (no hay servidor delante) y tienen que seguir
  # desplegandose en cada push, porque Vercel no las toca.
  reglas:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Desplegar reglas e indices de Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/cuenta-servicio.json
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Sin FIREBASE_SERVICE_ACCOUNT: me salto el despliegue."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > cuenta-servicio.json
          npm install -g firebase-tools

          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project bicifastness --non-interactive

          rm -f cuenta-servicio.json

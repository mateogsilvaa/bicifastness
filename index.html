<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="BiciFastness: compite con tus tiempos de BiciMAD por Madrid.">
<title>Iniciar sesion | BiciFastness</title>
<link rel="icon" href="/images/logo.png" type="image/png">
<link rel="stylesheet" href="/assets/css/app.css">
<style>
  body { justify-content: center; align-items: center; padding-bottom: 0; }
  .card { width: 100%; max-width: 360px; text-align: center; }
  h1 { color: var(--primary); margin: 0 0 5px; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }
  h2.sub { border: none; color: var(--text-muted); font-weight: 600; font-size: .9rem; margin: 0 0 25px; display: block; padding: 0; }
  input { margin: 10px 0; text-align: left; }
  .enlace { display: block; margin-top: 15px; font-size: .85rem; color: var(--text-muted); text-decoration: none; font-weight: 600; }
  .enlace:hover { color: var(--primary); }
  .invitado { display: block; margin-top: 15px; font-size: .9rem; font-weight: 700; color: var(--primary); text-decoration: none; padding: 12px; border: 1px solid var(--border); border-radius: 8px; }
  .invitado:hover { background: rgba(0,113,195,.1); border-color: var(--primary); }
  #pie-legal { border: none; margin-top: 24px; padding: 0; }
</style>
</head>
<body>
<main class="card">
  <h1>BiciFastness</h1>
  <h2 class="sub">Iniciar sesion</h2>

  <form id="form-login" novalidate>
    <label class="solo-lectores" for="email">Correo electronico</label>
    <input type="email" id="email" name="email" placeholder="Correo electronico"
           autocomplete="email" required>

    <label class="solo-lectores" for="password">Contrasena</label>
    <input type="password" id="password" name="password" placeholder="Contrasena"
           autocomplete="current-password" required>

    <button type="submit" id="btn-entrar">Entrar</button>
  </form>

  <p class="mensaje" id="mensaje"></p>

  <a href="#" class="enlace" id="btn-recuperar">He olvidado mi contrasena</a>
  <a href="/register/" class="enlace">No tengo cuenta. Quiero registrarme</a>
  <a href="/home/" class="invitado">Explorar sin cuenta</a>

  <footer id="pie-legal"></footer>
</main>

<script type="module">
  import {
    auth, onAuthStateChanged, signInWithEmailAndPassword,
    sendPasswordResetEmail, traducirErrorAuth,
  } from '/assets/js/firebase.js';
  import { aplicarTema, montarPieLegal, montarAvisoCookies } from '/assets/js/ui.js';
  import { id, estado } from '/assets/js/dom.js';

  aplicarTema();
  montarPieLegal();
  montarAvisoCookies();

  const form = id('form-login');
  const boton = id('btn-entrar');
  const mensaje = id('mensaje');

  onAuthStateChanged(auth, (usuario) => {
    if (usuario) window.location.replace('/home/');
  });

  form.addEventListener('submit', async (evento) => {
    evento.preventDefault();
    const email = id('email').value.trim().toLowerCase();
    const clave = id('password').value;

    if (!email || !clave) {
      estado(mensaje, 'Rellena los dos campos.', 'error');
      return;
    }

    boton.disabled = true;
    boton.textContent = 'Entrando...';
    estado(mensaje, '');

    try {
      // Un unico sistema de identidad. La version anterior tambien creaba una
      // cuenta en PocketBase con la contrasena escrita aqui: si el usuario no
      // existia alli, la CREABA con la clave introducida, lo que permitia
      // apropiarse de la cuenta de otro con solo conocer su correo.
      await signInWithEmailAndPassword(auth, email, clave);
      window.location.replace('/home/');
    } catch (error) {
      boton.disabled = false;
      boton.textContent = 'Entrar';
      estado(mensaje, traducirErrorAuth(error), 'error');
    }
  });

  id('btn-recuperar').addEventListener('click', async (evento) => {
    evento.preventDefault();
    const email = id('email').value.trim().toLowerCase();
    if (!email) {
      estado(mensaje, 'Escribe tu correo arriba y vuelve a pulsar aqui.', 'aviso');
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
    } catch (error) {
      // Da igual si el correo existe o no: responder distinto permitiria
      // averiguar que direcciones estan registradas.
      console.debug('recuperacion', error.code);
    }
    estado(mensaje, 'Si ese correo tiene cuenta, recibiras un enlace para cambiar la contrasena.', 'exito');
  });
</script>
</body>
</html>

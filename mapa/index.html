<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Mapa de dominio territorial: que clan controla cada estacion de BiciMAD en Madrid.">
<title>Mapa | BiciFastness</title>
<link rel="icon" href="/images/logo.png" type="image/png">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  body { padding-bottom: 0; }
  #mapa { width: 100%; height: calc(100vh - 62px); }
  @media (max-width: 850px) { #mapa { height: calc(100vh - 62px - 66px); } }
  .leaflet-popup-content-wrapper { background: var(--bg-card); color: var(--text-main); border-radius: var(--radio); }
  .leaflet-popup-tip { background: var(--bg-card); }
  .popup h3 { margin: 0 0 4px; font-size: 1rem; }
  .popup p { margin: 0 0 10px; font-size: .8rem; color: var(--text-muted); }
  .popup .dominio { display: inline-block; padding: 4px 10px; border-radius: var(--radio); color: #fff; font-size: .75rem; font-weight: 700; }
  .popup a { display: block; margin-top: 10px; text-align: center; background: var(--primary); color: #fff; padding: 8px; border-radius: var(--radio-s); text-decoration: none; font-weight: 700; font-size: .82rem; }
  .leyenda { position: absolute; bottom: 20px; left: 20px; z-index: 500; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: .78rem; max-height: 40vh; overflow-y: auto; }
  .leyenda div { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .leyenda i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  @media (max-width: 850px) { .leyenda { bottom: 80px; left: 10px; font-size: .72rem; } }
  .enlaces-legales { position: absolute; bottom: 20px; right: 20px; z-index: 500; display: flex; gap: 12px; background: var(--nav-bg); backdrop-filter: blur(6px); border-radius: var(--radio-s); padding: 6px 12px; }
  .enlaces-legales a { color: var(--text-muted); font-size: .7rem; text-decoration: none; }
  .enlaces-legales a:hover { color: var(--primary); }
  @media (max-width: 850px) { .enlaces-legales { bottom: 80px; right: 10px; } }
</style>
</head>
<body>
<a href="#mapa" class="saltar-contenido">Saltar al mapa</a>
<nav id="nav-principal"></nav>
<div class="bottom-nav" id="nav-inferior"></div>

<div id="mapa" role="application" aria-label="Mapa de estaciones de BiciMAD por clan dominante"></div>
<div class="leyenda" id="leyenda" hidden></div>

<!-- El mapa ocupa toda la pantalla y no lleva pie, pero el acceso a la
     informacion legal tiene que estar disponible en todas las paginas
     (art. 10 LSSI-CE), asi que va aqui en pequeno. -->
<div class="enlaces-legales">
  <a href="/legal/aviso-legal/">Aviso legal</a>
  <a href="/legal/privacidad/">Privacidad</a>
  <a href="/legal/cookies/">Cookies</a>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module">
  import { db, collection, getDocs } from '/assets/js/firebase.js';
  import { iniciarPagina, aplicarTema } from '/assets/js/ui.js';
  import { id, el, reemplazar } from '/assets/js/dom.js';

  const tema = aplicarTema();
  iniciarPagina('mapa');

  const mapa = L.map('mapa', { zoomControl: true }).setView([40.4168, -3.7038], 13);

  L.tileLayer(
    tema === 'dark'
      ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
      : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    { attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19 }
  ).addTo(mapa);

  cargar();

  async function cargar() {
    try {
      const [clanesSnap, statsSnap, geojson] = await Promise.all([
        getDocs(collection(db, 'clanes')),
        getDocs(collection(db, 'estaciones_stats')),
        fetch('/data/emt.geojson').then((r) => {
          if (!r.ok) throw new Error('No se ha podido cargar el mapa de estaciones.');
          return r.json();
        }),
      ]);

      const porClan = new Map(clanesSnap.docs.map((d) => [d.id, d.data()]));
      const porEstacion = new Map(statsSnap.docs.map((d) => [d.id, d.data()]));

      L.geoJSON(geojson, {
        pointToLayer: (feature, latlng) => {
          const numero = String(feature.properties.number || '');
          const stats = porEstacion.get(numero);
          const clan = stats?.clanDominante ? porClan.get(stats.clanDominante) : null;

          return L.circleMarker(latlng, {
            radius: 7,
            fillColor: colorSeguro(clan?.color) || '#888',
            color: '#fff',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9,
          });
        },
        onEachFeature: (feature, capa) => {
          const numero = String(feature.properties.number || '');
          const stats = porEstacion.get(numero);
          const clan = stats?.clanDominante ? porClan.get(stats.clanDominante) : null;

          // El popup se construye con nodos, no con una plantilla de HTML.
          // La version anterior interpolaba el nombre y el COLOR del clan
          // directamente dentro de un atributo style, y el color lo elegia quien
          // creaba el clan: `style="background:${color}"` con un color como
          // `red" onload="...` rompia el atributo y ejecutaba codigo.
          const dominio = el('span', {
            clase: 'dominio',
            texto: clan ? `Dominada por ${clan.nombre}` : 'Territorio neutral',
          });
          dominio.style.background = colorSeguro(clan?.color) || '#888';

          capa.bindPopup(el('div', { clase: 'popup' }, [
            el('h3', { texto: feature.properties.Name || `Estacion ${numero}` }),
            el('p', { texto: feature.properties.Address || '' }),
            dominio,
            el('a', {
              texto: 'Competir en esta estacion',
              attrs: { href: `/subir/?origen=${encodeURIComponent(numero)}` },
            }),
          ]), { minWidth: 230 });
        },
      }).addTo(mapa);

      pintarLeyenda(clanesSnap.docs.map((d) => d.data()), porEstacion);
    } catch (error) {
      console.error('Error inicializando el mapa', error);
    }
  }

  /** Solo se admiten colores hexadecimales. Cualquier otra cosa se descarta. */
  function colorSeguro(valor) {
    return /^#[0-9a-f]{3,8}$/i.test(String(valor || '')) ? valor : null;
  }

  function pintarLeyenda(clanes, porEstacion) {
    const conteo = new Map();
    for (const stats of porEstacion.values()) {
      if (stats.clanDominante) conteo.set(stats.clanDominante, (conteo.get(stats.clanDominante) || 0) + 1);
    }

    const conTerritorio = clanes
      .filter((c) => conteo.has(c.clanId))
      .sort((a, b) => conteo.get(b.clanId) - conteo.get(a.clanId))
      .slice(0, 12);

    if (!conTerritorio.length) return;

    reemplazar(id('leyenda'), [
      el('strong', { texto: 'Dominio', estilo: { display: 'block', marginBottom: '8px' } }),
      ...conTerritorio.map((clan) => {
        const punto = el('i');
        punto.style.background = colorSeguro(clan.color) || '#888';
        return el('div', {}, [punto, el('span', { texto: `${clan.nombre} (${conteo.get(clan.clanId)})` })]);
      }),
    ]);
    id('leyenda').hidden = false;
  }
</script>
</body>
</html>

<a href="#principal" class="saltar-contenido">Saltar al contenido</a>
<!-- 13f · Admin · Redes: elige pieza y periodo, revisa y descarga. -->
<main class="adm-pagina" id="principal">
  <p class="mensaje" id="mensaje" aria-live="polite"></p>
  <div class="redes-13f">
    <div class="redes-panel">
      <strong class="redes-titulo">Generar pieza</strong>
      <div class="redes-piezas" id="piezas" role="group" aria-label="Pieza"></div>
      <div class="redes-campo">
        <span>Periodo</span>
        <div class="redes-periodo" id="periodo"></div>
      </div>
      <div class="redes-campo">
        <span>Pilotos que salen</span>
        <div class="redes-pilotos" id="pilotos"></div>
      </div>
      <div class="redes-hueco"></div>
      <button class="btn" type="button" id="btn-descargar">Descargar PNG</button>
    </div>
    <div class="redes-vista">
      <div class="redes-vista-cabeza"><strong id="vista-titulo">Vista previa</strong><span id="vista-medida"></span></div>
      <div class="redes-lienzo" id="lienzo"></div>
      <span class="redes-nota" id="vista-nota"></span>
    </div>
  </div>
</main>

<script type="module" src="/assets/js/paginas/admin-redes.js"></script>

name: Verificar viajes

# El worker es el servidor de confianza de la app. Coge los viajes que esperan
# analisis y los aprueba, los rechaza o los manda a revision humana.
#
# SIEMPRE ENCENDIDO, A EFECTOS PRACTICOS. El cron pide una ejecucion cada 5
# minutos (el minimo que admite GitHub), pero GitHub retrasa las programadas
# cuando hay carga: el hueco real esta entre 5 y 15 minutos. Antes cada
# ejecucion vigilaba la cola 4 minutos y se iba, asi que entre una y la
# siguiente habia tramos de hasta 10 minutos en los que nadie miraba. Ahora cada
# ejecucion vigila 9 minutos y se SOLAPA con la siguiente: mientras una corre, la
# siguiente espera en cola (`concurrency`, abajo) y arranca en cuanto la otra
# termina. El resultado es una vigilancia casi continua con revision cada 30 s.
#
# Es gratis porque el repositorio es publico. En uno privado esto consumiria
# ~1.400 minutos de Actions al dia: para eso se baja VENTANA_MINUTOS a 0.
#
# Va aqui y no en Cloud Functions porque desplegar funciones en Firebase exige
# el plan Blaze (tarjeta), mientras que Actions es gratis e ilimitado en
# repositorios publicos.

on:
  # Cada 5 minutos, que es lo minimo que GitHub deja. Sin `FIREBASE_SERVICE_ACCOUNT`
  # el worker sale limpio (ver el paso de abajo), asi que despertar sin
  # credenciales no manda correos de fallo.
  schedule:
  - cron: '*/5 * * * *'

  # Para poder lanzarlo a mano desde la pestana Actions sin esperar al reloj.
  workflow_dispatch:
    inputs:
      simular:
        description: 'Analizar sin escribir nada en la base de datos'
        type: boolean
        default: false

# Dos workers a la vez procesarian los mismos viajes, asi que solo corre uno. Si
# llega otra ejecucion mientras hay una en marcha, ESPERA (no cancela a la que
# corre) y arranca cuando acabe; si llegan varias, se queda la mas reciente. Es
# lo que permite que cada ejecucion dure mas que el periodo del cron sin pisarse.
concurrency:
  group: verificar-viajes
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    # La ejecucion se queda dando pasadas a la cola (VENTANA_MINUTOS en
    # worker.js), asi que el limite tiene que dejar sitio a la ventana mas el
    # trabajo periodico del final y el arranque.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `setup-node` cachea la CARPETA DE NPM, no las dependencias: con solo eso
      # `npm ci` sigue instalando y compilando sharp en cada ejecucion, que es de
      # lo mas lento del arranque. Esto cachea node_modules ya instalado.
      - name: Cache de dependencias del worker
        id: modulos
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: worker-modulos-${{ runner.os }}-node20-${{ hashFiles('backend/package-lock.json') }}

      - name: Instalar dependencias
        if: steps.modulos.outputs.cache-hit != 'true'
        working-directory: backend
        run: npm ci

      # Red de seguridad, no el camino normal: el modelo de idioma viaja en el
      # repositorio (`assets/ocr/spa.traineddata.gz`) y `ocr.js` apunta ahi con
      # `langPath`, asi que en condiciones normales no se baja nada. Esto solo
      # cubre el caso de que ese fichero falte y tesseract vuelva a la descarga.
      - name: Cache del idioma del OCR
        uses: actions/cache@v4
        with:
          path: backend/.tesseract
          key: tesseract-spa-${{ runner.os }}

      # Ya NO se regeneran aqui los datos compartidos: `assets/data` y
      # `backend/lib` estan en el repositorio, y `ci.yml` falla si no coinciden
      # con sus fuentes. Regenerarlos en cada pasada del cron era ~10 s por
      # ejecucion para reescribir dos ficheros identicos.

      - name: Procesar la cola
        working-directory: backend
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Correo por Gmail (la cuenta del proyecto) con una contraseña de
          # aplicacion. Si faltan, Resend; si falta todo, no se envia correo.
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_CLAVE_APLICACION: ${{ secrets.GMAIL_CLAVE_APLICACION }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # A quien avisar cuando la cuota se acerque al limite (#38). Sin esto
          # el aviso se queda en el log del workflow, donde no lo lee nadie
          # hasta que ya es tarde.
          CORREO_ADMIN: ${{ secrets.CORREO_ADMIN }}
          # Desde donde salen los correos, p. ej. "BiciFastness <avisos@tudominio.es>".
          # Tiene que ser un dominio verificado en Resend. Sin el, el de worker.js.
          CORREO_REMITENTE: ${{ secrets.CORREO_REMITENTE }}
          # La direccion publica para los enlaces de los correos. Sin ella, la de Vercel.
          SITIO_URL: ${{ secrets.SITIO_URL }}
          # Avisos push (#33). Sin ellas no se envia nada y no es un error: es
          # el estado normal hasta que alguien genere el par con
          # `node scripts/claves-push.js`.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          # Cuanto se queda vivo dando pasadas, y cada cuanto. Con 0 vuelve al
          # comportamiento de antes: una mirada a la cola y a casa.
          #
          # 9 minutos: mas que el periodo del cron (5), para que cada ejecucion
          # se solape con la siguiente y no queden huecos. 30 segundos entre
          # pasadas: son ~3 lecturas por pasada (docs/COSTE.md), unas 8.600
          # lecturas al dia en vacio, el 17% de la cuota gratuita. Por encima
          # del 95% de cuota el worker deja de dar vueltas solo.
          VENTANA_MINUTOS: '9'
          ESPERA_SEGUNDOS: '30'
        run: |
          # Mientras no haya credenciales no hay nada que verificar, y el cron
          # se despierta igual. Sin esta salida limpia, cada ejecucion cuenta
          # como fallo y manda un correo: son ~288 al dia.
          #
          # El worker SI debe morir con error si le falta la credencial (lo hace
          # en worker.js): decidir que el proyecto todavia no esta configurado
          # es cosa del workflow, no suya.
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::Sin FIREBASE_SERVICE_ACCOUNT: no hay cola que procesar. Crea los secretos (README, apartado 3)."
            exit 0
          fi
          node worker.js ${{ inputs.simular && '--simular' || '' }}

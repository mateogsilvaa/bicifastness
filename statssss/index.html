<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Estadisticas publicas de BiciFastness.">
<title>Estadisticas | BiciFastness</title>
<link rel="icon" href="/images/logo.png" type="image/png">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
<style>
  .container { max-width: 900px; text-align: center; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; margin-top: 30px; }
  .cifra { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 30px 20px; }
  .cifra i { font-size: 2rem; color: var(--primary); display: block; margin-bottom: 12px; }
  .cifra strong { display: block; font-size: 2.4rem; font-weight: 900; }
  .cifra span { font-size: .82rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
</style>
</head>
<body>
<a href="#principal" class="saltar-contenido">Saltar al contenido</a>
<nav id="nav-principal"></nav>
<div class="bottom-nav" id="nav-inferior"></div>

<main class="container" id="principal">
  <h2>Estadisticas</h2>
  <p class="mensaje" id="mensaje">Cargando...</p>

  <div class="rejilla" id="rejilla" hidden>
    <div class="cifra">
      <i class="fi fi-sr-users"></i>
      <strong id="c-pilotos">-</strong>
      <span>Pilotos registrados</span>
    </div>
    <div class="cifra">
      <i class="fi fi-sr-route"></i>
      <strong id="c-viajes">-</strong>
      <span>Tiempos verificados</span>
    </div>
    <div class="cifra">
      <i class="fi fi-sr-shield-check"></i>
      <strong id="c-clanes">-</strong>
      <span>Clanes activos</span>
    </div>
    <div class="cifra">
      <i class="fi fi-sr-map-marker"></i>
      <strong id="c-estaciones">-</strong>
      <span>Estaciones conquistadas</span>
    </div>
  </div>
</main>

<footer id="pie-legal"></footer>

<script type="module">
  import { db, collection, getDocs, query, where } from '/assets/js/firebase.js';
  import { iniciarPagina } from '/assets/js/ui.js';
  import { id, estado } from '/assets/js/dom.js';

  iniciarPagina('');

  (async () => {
    try {
      const [pilotos, viajes, clanes, estaciones] = await Promise.all([
        getDocs(collection(db, 'usuarios')),
        getDocs(query(collection(db, 'tiempos_viaje'), where('verificado', '==', true))),
        getDocs(collection(db, 'clanes')),
        getDocs(collection(db, 'estaciones_stats')),
      ]);

      const conquistadas = estaciones.docs.filter((d) => d.data().clanDominante).length;
      const formato = (n) => n.toLocaleString('es-ES');

      id('c-pilotos').textContent = formato(pilotos.size);
      id('c-viajes').textContent = formato(viajes.size);
      id('c-clanes').textContent = formato(clanes.size);
      id('c-estaciones').textContent = formato(conquistadas);

      estado(id('mensaje'), '');
      id('rejilla').hidden = false;
    } catch (error) {
      estado(id('mensaje'), `No se han podido cargar las estadisticas: ${error.message}`, 'error');
    }
  })();
</script>
</body>
</html>

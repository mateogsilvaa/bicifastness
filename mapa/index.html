<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn-uicons.flaticon.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdn-uicons.flaticon.com; img-src 'self' data: blob: https://api.dicebear.com https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src https://www.google.com https://bicifastness.firebaseapp.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Mapa de dominio territorial: que clan controla cada estacion de BiciMAD en Madrid.">
<title>Mapa | BiciFastness</title>
<link rel="icon" href="/images/logo.png" type="image/png">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  body { padding-bottom: 0; }
  #mapa { width: 100%; height: calc(100vh - 62px); }
  @media (max-width: 850px) { #mapa { height: calc(100vh - 62px - 66px); } }
  .leaflet-popup-content-wrapper { background: var(--bg-card); color: var(--text-main); border-radius: var(--radio); }
  .leaflet-popup-tip { background: var(--bg-card); }
  .popup h3 { margin: 0 0 4px; font-size: 1rem; }
  .popup p { margin: 0 0 10px; font-size: .8rem; color: var(--text-muted); }
  .popup .dominio { display: inline-block; padding: 4px 10px; border-radius: var(--radio); color: #fff; font-size: .75rem; font-weight: 700; }
  .popup a { display: block; margin-top: 10px; text-align: center; background: var(--primary); color: #fff; padding: 8px; border-radius: var(--radio-s); text-decoration: none; font-weight: 700; font-size: .82rem; }
  .leyenda { position: absolute; bottom: 20px; left: 20px; z-index: 500; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: .78rem; max-height: 40vh; overflow-y: auto; }
  .leyenda div { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .leyenda i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  @media (max-width: 850px) { .leyenda { bottom: 80px; left: 10px; font-size: .72rem; } }
  .enlaces-legales { position: absolute; bottom: 20px; right: 20px; z-index: 500; display: flex; gap: 12px; background: var(--nav-bg); backdrop-filter: blur(6px); border-radius: var(--radio-s); padding: 6px 12px; }
  .enlaces-legales a { color: var(--text-muted); font-size: .7rem; text-decoration: none; }
  .enlaces-legales a:hover { color: var(--primary); }
  @media (max-width: 850px) { .enlaces-legales { bottom: 80px; right: 10px; } }
</style>
</head>
<body>
<a href="#mapa" class="saltar-contenido">Saltar al mapa</a>
<nav id="nav-principal"></nav>
<div class="bottom-nav" id="nav-inferior"></div>

<div id="mapa" role="application" aria-label="Mapa de estaciones de BiciMAD por clan dominante"></div>
<div class="leyenda" id="leyenda" hidden></div>

<!-- El mapa ocupa toda la pantalla y no lleva pie, pero el acceso a la
     informacion legal tiene que estar disponible en todas las paginas
     (art. 10 LSSI-CE), asi que va aqui en pequeno. -->
<div class="enlaces-legales">
  <a href="/legal/aviso-legal/">Aviso legal</a>
  <a href="/legal/privacidad/">Privacidad</a>
  <a href="/legal/cookies/">Cookies</a>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="/assets/js/paginas/mapa.js"></script>
</body>
</html>
